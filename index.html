<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastosApp — Controle de Gastos Pessoais</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   VARIÁVEIS & RESET
═══════════════════════════════════════════════════════════ */
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3350;
  --accent: #6c63ff;
  --accent2: #ff6584;
  --green: #43e97b;
  --yellow: #f7971e;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Scrollbar customizada fina dark */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg); }

/* ═══════════════════════════════════════════════════════════
   LAYOUT PRINCIPAL
═══════════════════════════════════════════════════════════ */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 230px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: width 0.25s ease;
  overflow: hidden;
}
.main {
  margin-left: 230px;
  min-height: 100vh;
  transition: margin-left 0.25s ease;
}
.page {
  display: none;
  padding: 28px 28px 40px;
  animation: fadeIn 0.2s ease;
}
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════ */
.sidebar-logo {
  padding: 20px 16px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-logo svg { flex-shrink: 0; }
.sidebar-logo-text {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.sidebar-nav {
  flex: 1;
  padding: 10px 8px;
  overflow-y: auto;
  overflow-x: hidden;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text2);
  transition: background 0.18s, color 0.18s;
  white-space: nowrap;
  user-select: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item svg { flex-shrink: 0; min-width: 20px; }
.nav-label { font-size: 13px; font-weight: 500; white-space: nowrap; }
.sidebar-footer {
  padding: 10px 8px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.notif-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text2);
  transition: background 0.18s, color 0.18s;
  position: relative;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
}
.notif-btn:hover { background: var(--surface2); color: var(--text); }
.notif-badge {
  position: absolute;
  top: 5px;
  left: 24px;
  background: var(--accent2);
  color: #fff;
  border-radius: 50%;
  min-width: 16px;
  height: 16px;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  padding: 0 3px;
  line-height: 1;
}
.sidebar-version {
  padding: 4px 12px;
  font-size: 11px;
  color: var(--text2);
  white-space: nowrap;
  opacity: 0.7;
}

/* ═══════════════════════════════════════════════════════════
   TOPBAR DE PÁGINA
═══════════════════════════════════════════════════════════ */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.topbar-title {
  font-size: 22px;
  font-weight: 700;
  flex: 1;
  min-width: 160px;
}

/* ═══════════════════════════════════════════════════════════
   BOTÕES
═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: all 0.18s;
  white-space: nowrap;
  line-height: 1.2;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #5a52e0; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border); }
.btn-danger { background: rgba(255,101,132,0.12); color: var(--accent2); border: 1px solid rgba(255,101,132,0.3); }
.btn-danger:hover:not(:disabled) { background: rgba(255,101,132,0.22); }
.btn-green-soft { background: rgba(67,233,123,0.12); color: var(--green); border: 1px solid rgba(67,233,123,0.3); }
.btn-green-soft:hover:not(:disabled) { background: rgba(67,233,123,0.22); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn-icon {
  padding: 6px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.18s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-icon:hover { color: var(--text); background: var(--border); }

/* ═══════════════════════════════════════════════════════════
   CARDS DE RESUMO
═══════════════════════════════════════════════════════════ */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.summary-card:hover { border-color: var(--accent); }
.card-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
}
.card-value {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.card-sub { font-size: 12px; color: var(--text2); }
.card-red .card-value { color: var(--accent2); }
.card-green .card-value { color: var(--green); }
.card-yellow .card-value { color: var(--yellow); }
.card-accent .card-value { color: var(--accent); }
.card-positive .card-value { color: var(--green); }
.card-negative .card-value { color: var(--accent2); }

/* ═══════════════════════════════════════════════════════════
   WIDGETS
═══════════════════════════════════════════════════════════ */
.widgets-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.widget {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.widget-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 14px;
}

/* ═══════════════════════════════════════════════════════════
   GRÁFICOS
═══════════════════════════════════════════════════════════ */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.chart-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.chart-box-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}
.chart-wrap {
  position: relative;
  height: 220px;
}

/* ═══════════════════════════════════════════════════════════
   TABELAS
═══════════════════════════════════════════════════════════ */
.table-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 22px;
}
.table-box-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-wrap: wrap;
}
.table-box-header h3 { font-size: 14px; font-weight: 600; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 11px 14px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(108,99,255,0.04); cursor: default; }
tfoot td {
  padding: 11px 14px;
  font-size: 13px;
  font-weight: 700;
  background: var(--surface2);
  border-top: 2px solid var(--border);
}
.table-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text2);
  font-size: 14px;
}

/* ═══════════════════════════════════════════════════════════
   BADGES
═══════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-green { background: rgba(67,233,123,0.14); color: var(--green); }
.badge-red { background: rgba(255,101,132,0.14); color: var(--accent2); }
.badge-yellow { background: rgba(247,151,30,0.14); color: var(--yellow); }
.badge-blue { background: rgba(59,130,246,0.14); color: #60a5fa; }
.badge-purple { background: rgba(108,99,255,0.14); color: var(--accent); }
.badge-gray { background: rgba(148,163,184,0.12); color: var(--text2); }

/* ═══════════════════════════════════════════════════════════
   BARRA DE PROGRESSO
═══════════════════════════════════════════════════════════ */
.progress-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--surface2);
  overflow: hidden;
  margin: 5px 0;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}
.prog-green { background: var(--green); }
.prog-yellow { background: var(--yellow); }
.prog-red { background: var(--accent2); }

/* ═══════════════════════════════════════════════════════════
   FORMULÁRIOS
═══════════════════════════════════════════════════════════ */
.form-row {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-width: 140px;
}
.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
}
input[type="text"],
input[type="number"],
input[type="date"],
input[type="password"],
input[type="email"],
select,
textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 11px;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
  outline: none;
  transition: border-color 0.18s;
  appearance: none;
  -webkit-appearance: none;
}
input[type="text"]:focus,
input[type="number"]:focus,
input[type="date"]:focus,
input[type="password"]:focus,
select:focus,
textarea:focus { border-color: var(--accent); }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
select option { background: var(--surface2); color: var(--text); }
textarea { resize: vertical; min-height: 60px; }
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}
.checkbox-row input[type="checkbox"] {
  width: 16px; height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}
.checkbox-row label { font-size: 13px; color: var(--text); cursor: pointer; }
.input-with-btn { display: flex; gap: 6px; }
.input-with-btn input { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   MODAIS
═══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px;
  width: 100%;
  max-width: 530px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  position: relative;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97) translateY(-8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-sm { max-width: 380px; }
.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  padding-right: 28px;
}
.modal-close {
  position: absolute;
  top: 20px; right: 20px;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 4px;
  border-radius: 4px;
  transition: color 0.18s;
}
.modal-close:hover { color: var(--text); }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════
   TOAST SYSTEM
═══════════════════════════════════════════════════════════ */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.4;
  box-shadow: var(--shadow);
  min-width: 260px;
  max-width: 360px;
  pointer-events: all;
  animation: toastIn 0.3s ease;
}
.toast.removing { animation: toastOut 0.3s ease forwards; }
.toast-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.toast-success { border-left: 3px solid var(--green); }
.toast-error { border-left: 3px solid var(--accent2); }
.toast-info { border-left: 3px solid var(--accent); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(50px); }
}

/* ═══════════════════════════════════════════════════════════
   PAINEL DE ALERTAS
═══════════════════════════════════════════════════════════ */
.alerts-panel {
  position: fixed;
  bottom: 70px;
  left: 10px;
  width: 310px;
  z-index: 150;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none;
  max-height: 420px;
  overflow-y: auto;
  animation: fadeIn 0.2s ease;
}
.alerts-panel.open { display: block; }
.alerts-panel-header {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.alerts-panel-header span { font-size: 11px; color: var(--text2); font-weight: 400; }
.alert-item {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.4;
}
.alert-item:last-child { border-bottom: none; }
.alert-msg { flex: 1; }
.alert-dismiss {
  font-size: 11px;
  color: var(--text2);
  cursor: pointer;
  padding: 2px 7px;
  border-radius: 4px;
  background: none;
  border: 1px solid var(--border);
  white-space: nowrap;
  flex-shrink: 0;
  font-family: inherit;
  transition: all 0.18s;
}
.alert-dismiss:hover { background: var(--surface2); color: var(--text); }
.no-alerts {
  text-align: center;
  padding: 28px 20px;
  color: var(--text2);
  font-size: 13px;
}

/* ═══════════════════════════════════════════════════════════
   FILTROS
═══════════════════════════════════════════════════════════ */
.filters-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: flex-end;
}
.filters-row input,
.filters-row select {
  flex: 1;
  min-width: 110px;
  max-width: 200px;
}

/* ═══════════════════════════════════════════════════════════
   PAGINAÇÃO
═══════════════════════════════════════════════════════════ */
.pagination {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
}
.page-btn {
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  border-radius: 7px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
}
.page-btn:hover { background: var(--border); color: var(--text); }
.page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info { font-size: 12px; color: var(--text2); margin-left: auto; }

/* ═══════════════════════════════════════════════════════════
   CARDS DE ORÇAMENTO
═══════════════════════════════════════════════════════════ */
.budget-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.budget-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.budget-card:hover { border-color: var(--accent); }
.budget-cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.budget-cat-icon { font-size: 24px; line-height: 1; }
.budget-cat-name { font-weight: 600; font-size: 14px; flex: 1; }
.budget-amounts {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
}
.budget-pct {
  font-size: 11px;
  color: var(--text2);
  text-align: right;
  margin-top: 3px;
}
.budget-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.budget-edit { margin-top: 10px; }

/* ═══════════════════════════════════════════════════════════
   CARDS DE METAS
═══════════════════════════════════════════════════════════ */
.goals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.goal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.goal-card:hover { border-color: var(--accent); }
.goal-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.goal-emoji { font-size: 30px; line-height: 1; flex-shrink: 0; }
.goal-name { font-weight: 700; font-size: 15px; flex: 1; line-height: 1.3; }
.goal-status-badge { flex-shrink: 0; }
.goal-progress-text { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.goal-monthly { font-size: 12px; color: var(--text2); margin-top: 8px; }
.goal-deadline { font-size: 11px; color: var(--text2); margin-top: 4px; }
.goal-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════════════
   ANÁLISE
═══════════════════════════════════════════════════════════ */
.analysis-section { margin-bottom: 32px; }
.analysis-section-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.highlight-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.highlight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
  box-shadow: var(--shadow);
}
.highlight-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
.highlight-val { font-size: 17px; font-weight: 700; margin-top: 5px; }
.trend-up { color: var(--accent2); font-weight: 700; }
.trend-down { color: var(--green); font-weight: 700; }
.trend-neutral { color: var(--text2); font-weight: 700; }

/* ═══════════════════════════════════════════════════════════
   CONSULTOR IA / CHAT
═══════════════════════════════════════════════════════════ */
.api-key-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
}
.api-key-box label { font-size: 12px; font-weight: 600; color: var(--text2); display: block; margin-bottom: 8px; }
.api-key-row { display: flex; gap: 8px; align-items: center; }
.api-key-row input { flex: 1; }
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.chip {
  padding: 6px 13px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 12px;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  transition: all 0.18s;
  white-space: nowrap;
}
.chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.chat-area {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 0;
}
.chat-messages {
  padding: 16px;
  min-height: 200px;
  max-height: 420px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.55;
  word-break: break-word;
}
.chat-msg.user {
  background: var(--accent);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 3px;
}
.chat-msg.assistant {
  background: var(--surface2);
  color: var(--text);
  align-self: flex-start;
  border-bottom-left-radius: 3px;
  border: 1px solid var(--border);
}
.chat-input-row {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
  align-items: flex-end;
}
.chat-input-row textarea {
  flex: 1;
  resize: none;
  min-height: 40px;
  max-height: 110px;
  padding: 8px 12px;
  border-radius: 8px;
}
.typing-indicator {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 8px 4px;
}
.typing-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text2);
  animation: typingBounce 1.3s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ═══════════════════════════════════════════════════════════
   IMPORTAR FATURA — UPLOAD ZONE
═══════════════════════════════════════════════════════════ */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 44px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 22px;
  position: relative;
}
.upload-zone:hover,
.upload-zone.drag-over {
  border-color: var(--accent);
  background: rgba(108,99,255,0.06);
}
.upload-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.upload-icon { font-size: 42px; line-height: 1; margin-bottom: 12px; }
.upload-text { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.upload-sub { font-size: 12px; color: var(--text2); }

/* Preview da fatura importada */
.invoice-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  display: none;
}
.invoice-preview.show { display: block; }
.preview-header {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.preview-stat { text-align: center; }
.preview-stat-val { font-size: 18px; font-weight: 700; }
.preview-stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
.preview-filename { font-weight: 700; font-size: 15px; flex: 1; }

/* Lista de faturas importadas */
.invoice-list { margin-top: 28px; }
.invoice-list-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.invoice-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  gap: 10px;
}
.invoice-item-info { flex: 1; }
.invoice-item-name { font-weight: 600; }
.invoice-item-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ═══════════════════════════════════════════════════════════
   PÁGINA CATEGORIAS
═══════════════════════════════════════════════════════════ */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.cat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.18s;
}
.cat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cat-icon-big { font-size: 36px; line-height: 1; margin-bottom: 8px; }
.cat-name { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.cat-pct { font-size: 24px; font-weight: 700; margin-bottom: 3px; }
.cat-val { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.cat-count { font-size: 11px; color: var(--text2); margin-top: 4px; }
.cat-total-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  margin-top: 4px;
}

/* ═══════════════════════════════════════════════════════════
   GAUGE / SCORE
═══════════════════════════════════════════════════════════ */
.gauge-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

/* ═══════════════════════════════════════════════════════════
   RECORRENTES — PIZZA CSS
═══════════════════════════════════════════════════════════ */
.recurring-pie-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.css-pie-chart {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pie-legend { font-size: 12px; color: var(--text2); }
.pie-legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.pie-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════════
   SEÇÃO DE COMPROMISSOS FIXOS (widget dashboard)
═══════════════════════════════════════════════════════════ */
.fixed-list { list-style: none; margin-top: 10px; }
.fixed-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  gap: 6px;
}
.fixed-item:last-child { border-bottom: none; }
.fixed-item-name { flex: 1; color: var(--text2); truncate: ellipsis; overflow: hidden; white-space: nowrap; }
.fixed-item-val { font-weight: 600; color: var(--text); flex-shrink: 0; }
.fixed-total {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 10px;
  color: var(--text);
}

/* ═══════════════════════════════════════════════════════════
   LISTA DE METAS WIDGET (dashboard)
═══════════════════════════════════════════════════════════ */
.goal-widget-item {
  margin-bottom: 12px;
}
.goal-widget-item:last-child { margin-bottom: 0; }
.goal-widget-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin-bottom: 4px;
}
.goal-widget-name { font-weight: 600; font-size: 13px; }
.goal-widget-pct { color: var(--text2); }

/* ═══════════════════════════════════════════════════════════
   INLINE EDIÇÃO ORÇAMENTO
═══════════════════════════════════════════════════════════ */
.budget-inline-edit { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.budget-inline-edit input { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   DIVISOR DE SEÇÃO
═══════════════════════════════════════════════════════════ */
.section-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

/* ═══════════════════════════════════════════════════════════
   SELECT ANALYSIS CATS
═══════════════════════════════════════════════════════════ */
.cat-filter-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.cat-filter-chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-family: inherit;
  transition: all 0.18s;
}
.cat-filter-chip.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVO
═══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  .sidebar { width: 60px; }
  .sidebar-logo-text,
  .nav-label,
  .sidebar-version { display: none; }
  .notif-btn .nav-label { display: none; }
  .main { margin-left: 60px; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .widgets-grid { grid-template-columns: 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; }
  .page { padding: 16px; }
  .highlight-cards { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 600px; }
  .modal { padding: 18px; }
  .filters-row input,
  .filters-row select { max-width: 100%; }
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
  .goals-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     MODAL: ADICIONAR / EDITAR TRANSAÇÃO
═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-tx" onclick="handleOverlayClick(event,'modal-tx')">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 class="modal-title" id="modal-tx-title">Nova Transação</h2>
    <button class="modal-close" onclick="closeModal('modal-tx')">✕</button>

    <div class="form-row">
      <div class="form-group">
        <label for="tx-date">Data</label>
        <input type="date" id="tx-date">
      </div>
      <div class="form-group">
        <label for="tx-type">Tipo</label>
        <select id="tx-type">
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label for="tx-desc">Descrição</label>
        <input type="text" id="tx-desc" placeholder="Ex: iFood, Aluguel...">

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT — será adicionado nas próximas partes
═══════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════ */
const CATEGORIES = [
  { id:'alimentacao', label:'Alimentação',  icon:'🍔', color:'#f97316' },
  { id:'transporte',  label:'Transporte',   icon:'🚗', color:'#3b82f6' },
  { id:'moradia',     label:'Moradia',      icon:'🏠', color:'#8b5cf6' },
  { id:'saude',       label:'Saúde',        icon:'💊', color:'#ec4899' },
  { id:'lazer',       label:'Lazer',        icon:'🎮', color:'#06b6d4' },
  { id:'educacao',    label:'Educação',     icon:'📚', color:'#84cc16' },
  { id:'compras',     label:'Compras',      icon:'🛍️', color:'#f59e0b' },
  { id:'financeiro',  label:'Financeiro',   icon:'💰', color:'#10b981' },
  { id:'outros',      label:'Outros',       icon:'📦', color:'#94a3b8' }
];

/* ═══════════════════════════════════════════════════════════
   GLOBAL STATE
═══════════════════════════════════════════════════════════ */
let cgTx = [];
let cgBudgets = {};
let cgGoals = [];
let cgDismissedAlerts = [];
let cgApiKey = '';
let cgInvoices = [];
let chatHistory = [];
let txPage = 1;
let txFilters = { text: '', month: '', category: '', type: '' };
let dbMonth = '';
let orcMonth = '';
let catMonth = '';
let importParsed = [];
let analysisCatSel = [];
let charts = {};
let currentEditId = null;

/* ═══════════════════════════════════════════════════════════
   UTILITY FUNCTIONS
═══════════════════════════════════════════════════════════ */
function uid() {
  return Math.random().toString(36).substr(2,9) + Date.now().toString(36);
}

function fmt(v) {
  return 'R$ ' + (+(v||0)).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function parseVal(s) {
  if (typeof s === 'number') return Math.abs(s);
  s = String(s).trim().replace(/[R$\s]/g,'');
  if (!s) return 0;
  // 1.234,56 → Brazilian format
  if (/^\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(s))
    return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
  return parseFloat(s.replace(',','.')) || 0;
}

function getCat(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];
}

function monthLabel(ym) {
  if (!ym) return '';
  const [y,m] = ym.split('-');
  const M = ['Jan.','Fev.','Mar.','Abr.','Mai.','Jun.','Jul.','Ago.','Set.','Out.','Nov.','Dez.'];
  return (M[parseInt(m)-1]||'') + ' ' + y;
}

function currentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function prevMonth(ym) {
  if (!ym) ym = currentMonth();
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function addMonths(ym, n) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dateDisp(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════════════
   LOCALSTORAGE
═══════════════════════════════════════════════════════════ */
function save() {
  localStorage.setItem('cgTransactions', JSON.stringify(cgTx));
  checkAlerts();
}
function load() {
  try { cgTx = JSON.parse(localStorage.getItem('cgTransactions') || '[]'); } catch(e) { cgTx=[]; }
}
function saveBudgets() { localStorage.setItem('cgBudgets', JSON.stringify(cgBudgets)); }
function saveGoals()   { localStorage.setItem('cgGoals', JSON.stringify(cgGoals)); }
function saveInvoices(){ localStorage.setItem('cgInvoices', JSON.stringify(cgInvoices)); }

/* ═══════════════════════════════════════════════════════════
   MONTH SELECT POPULATION
═══════════════════════════════════════════════════════════ */
function getMonthOpts(sel) {
  const cm = currentMonth(); const months = [];
  for (let i=11;i>=-1;i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return months.map(ym=>`<option value="${ym}"${ym===(sel||cm)?' selected':''}>${monthLabel(ym)}</option>`).join('');
}
function populateMonthSelects() {
  document.querySelectorAll('.month-select').forEach(el => { el.innerHTML = getMonthOpts(el.value); });
}
function populateCatSelects() {
  const noAll = CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
  document.querySelectorAll('.cat-select-form').forEach(el => { el.innerHTML = noAll; });
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function navigate(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const pg = document.getElementById('page-'+name);
  if (pg) pg.classList.add('active');
  const ni = document.querySelector(`.nav-item[data-page="${name}"]`);
  if (ni) ni.classList.add('active');
  document.getElementById('alerts-panel').classList.remove('open');
  const renders = {
    dashboard: renderDashboard, transacoes: renderTransacoes,
    orcamentos: renderOrcamentos, metas: renderMetas,
    analise: renderAnalise, ia: renderIA,
    importar: renderImportar, categorias: renderCategorias
  };
  if (renders[name]) renders[name]();
}

/* ═══════════════════════════════════════════════════════════
   TOAST SYSTEM
═══════════════════════════════════════════════════════════ */
function toast(msg, type='info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span>${escHtml(msg)}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 320);
  }, 3500);
}

/* ═══════════════════════════════════════════════════════════
   MODAL HELPERS
═══════════════════════════════════════════════════════════ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function handleOverlayClick(e, id) { if (e.target.id===id) closeModal(id); }

function toggleFreq() {
  const chk = document.getElementById('tx-recorrente');
  document.getElementById('freq-row').classList.toggle('hidden', !chk.checked);
}

function openAddTx(prefill) {
  currentEditId = null;
  document.getElementById('modal-tx-title').textContent = 'Nova Transação';
  document.getElementById('tx-date').value = today();
  document.getElementById('tx-desc').value = '';
  document.getElementById('tx-val').value = '';
  document.getElementById('tx-type').value = 'saida';
  document.getElementById('tx-cat').value = 'alimentacao';
  document.getElementById('tx-invoice').value = '';
  document.getElementById('tx-recorrente').checked = false;
  document.getElementById('tx-freq').value = 'mensal';
  document.getElementById('freq-row').classList.add('hidden');
  if (prefill) {
    if (prefill.date) document.getElementById('tx-date').value = prefill.date;
    if (prefill.type) document.getElementById('tx-type').value = prefill.type;
    if (prefill.category) document.getElementById('tx-cat').value = prefill.category;
  }
  openModal('modal-tx');
}

function openEditTx(id) {
  const t = cgTx.find(x=>x.id===id); if (!t) return;
  currentEditId = id;
  document.getElementById('modal-tx-title').textContent = 'Editar Transação';
  document.getElementById('tx-date').value = t.date||today();
  document.getElementById('tx-desc').value = t.description||'';
  document.getElementById('tx-val').value = t.value ? String(t.value).replace('.',',') : '';
  document.getElementById('tx-type').value = t.type||'saida';
  document.getElementById('tx-cat').value = t.category||'outros';
  document.getElementById('tx-invoice').value = t.invoice||'';
  document.getElementById('tx-recorrente').checked = !!t.recorrente;
  document.getElementById('tx-freq').value = t.frequencia||'mensal';
  document.getElementById('freq-row').classList.toggle('hidden', !t.recorrente);
  openModal('modal-tx');
}

function saveTx() {
  const date = document.getElementById('tx-date').value;
  const desc = document.getElementById('tx-desc').value.trim();
  const val  = parseVal(document.getElementById('tx-val').value);
  if (!date) { toast('Informe a data','error'); return; }
  if (!desc) { toast('Informe a descrição','error'); return; }
  if (!val || val<=0) { toast('Informe um valor válido','error'); return; }

  const tx = {
    id: currentEditId || uid(),
    date, description: desc, value: val,
    type: document.getElementById('tx-type').value,
    category: document.getElementById('tx-cat').value,
    invoice: document.getElementById('tx-invoice').value.trim(),
    invoiceId: null,
    recorrente: document.getElementById('tx-recorrente').checked,
    frequencia: document.getElementById('tx-recorrente').checked
      ? document.getElementById('tx-freq').value : null
  };
  if (currentEditId) {
    const idx = cgTx.findIndex(x=>x.id===currentEditId);
    if (idx>=0) cgTx[idx] = tx;
  } else {
    cgTx.push(tx);
  }
  save();
  closeModal('modal-tx');
  toast(currentEditId ? 'Transação atualizada' : 'Transação adicionada', 'success');
  const active = document.querySelector('.page.active');
  if (active) navigate(active.id.replace('page-',''));
}

function deleteTx(id) {
  if (!confirm('Excluir esta transação?')) return;
  cgTx = cgTx.filter(x=>x.id!==id);
  save();
  toast('Transação excluída','info');
  const active = document.querySelector('.page.active');
  if (active) navigate(active.id.replace('page-',''));
}

/* ═══════════════════════════════════════════════════════════
   SCORE DE SAÚDE
═══════════════════════════════════════════════════════════ */
function calcScore(month) {
  month = month || currentMonth();
  const txM   = cgTx.filter(t=>t.date&&t.date.startsWith(month));
  const saidas = txM.filter(t=>t.type==='saida');
  const entradas = txM.filter(t=>t.type==='entrada');
  const totS = saidas.reduce((s,t)=>s+(t.value||0),0);
  const totE = entradas.reduce((s,t)=>s+(t.value||0),0);
  let sc = 0;
  if (totE-totS > 0) sc += 30;
  const bKeys = Object.keys(cgBudgets);
  const budgOk = bKeys.length===0 || bKeys.every(cid=>{
    const g = saidas.filter(t=>t.category===cid).reduce((s,t)=>s+(t.value||0),0);
    return g <= cgBudgets[cid];
  });
  if (budgOk) sc += 20;
  const lc = saidas.filter(t=>t.category==='lazer'||t.category==='compras').reduce((s,t)=>s+(t.value||0),0);
  if (totS===0 || lc/totS < 0.3) sc += 20;
  if (cgGoals.length > 0) sc += 15;
  if (entradas.length > 0) sc += 15;
  return Math.min(sc,100);
}

function scoreLabel(s) {
  return s<=40?'Crítico':s<=60?'Atenção':s<=80?'Bom':'Excelente';
}
function scoreColor(s) {
  return s<=40?'var(--accent2)':s<=70?'var(--yellow)':'var(--green)';
}
function gaugeHTML(score) {
  const col = scoreColor(score);
  const lbl = scoreLabel(score);
  const arc = Math.PI * 80;
  const offset = arc - arc*(score/100);
  return `<div class="gauge-wrapper">
    <svg viewBox="0 0 200 115" style="width:180px;max-width:100%">
      <path d="M 20 100 A 80 80 0 0 1 180 100"
        fill="none" stroke="var(--border)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 20 100 A 80 80 0 0 1 180 100"
        fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${arc.toFixed(2)}"
        stroke-dashoffset="${offset.toFixed(2)}"/>
      <text x="100" y="90" text-anchor="middle" fill="${col}"
        font-size="34" font-weight="bold" font-family="Segoe UI,sans-serif">${score}</text>
      <text x="100" y="112" text-anchor="middle" fill="var(--text2)"
        font-size="13" font-family="Segoe UI,sans-serif">${lbl}</text>
    </svg>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   ALERT SYSTEM
═══════════════════════════════════════════════════════════ */
function checkAlerts() {
  const month = currentMonth();
  const txM   = cgTx.filter(t=>t.date&&t.date.startsWith(month));
  const saidas = txM.filter(t=>t.type==='saida');
  const entradas = txM.filter(t=>t.type==='entrada');
  const totS = saidas.reduce((s,t)=>s+(t.value||0),0);
  const totE = entradas.reduce((s,t)=>s+(t.value||0),0);
  const ym = month.replace('-','');
  const alerts = [];

  // Budget alerts
  Object.entries(cgBudgets).forEach(([cid,limit]) => {
    const spent = saidas.filter(t=>t.category===cid).reduce((s,t)=>s+(t.value||0),0);
    const pct = limit>0 ? spent/limit*100 : 0;
    const cat = getCat(cid);
    if (pct > 100) {
      alerts.push({ id:`budget-over-${cid}-${ym}`, msg:`🔴 ${cat.label} ultrapassou o limite em ${fmt(spent-limit)}` });
    } else if (pct > 90) {
      alerts.push({ id:`budget-near-${cid}-${ym}`, msg:`⚠️ ${cat.label} está em ${pct.toFixed(0)}% do limite` });
    }
  });

  // Negative balance
  if (totE > 0 && totE - totS < 0) {
    alerts.push({ id:`saldo-neg-${ym}`, msg:`📉 Saldo do mês está negativo: ${fmt(totE-totS)}` });
  }

  // Late goals
  const todayStr = today();
  cgGoals.forEach(g => {
    if (g.deadline && g.deadline < todayStr && g.current < g.target) {
      const pct = g.target>0 ? g.current/g.target*100 : 0;
      const daysLeft = Math.round((new Date(g.deadline)-new Date(todayStr))/86400000);
      if (pct < 50 && daysLeft > -30) {
        alerts.push({ id:`goal-late-${g.id.substr(0,8)}-${ym}`, msg:`🎯 Meta "${g.name}" está atrasada` });
      }
    }
  });

  const active = alerts.filter(a=>!cgDismissedAlerts.includes(a.id));
  const badge = document.getElementById('notif-badge');
  if (badge) {
    badge.textContent = active.length;
    badge.style.display = active.length>0 ? 'flex' : 'none';
  }
  document.getElementById('alerts-count-label').textContent = active.length ? `${active.length} ativo(s)` : '';

  const list = document.getElementById('alerts-list');
  if (!list) return;
  if (active.length === 0) {
    list.innerHTML = '<div class="no-alerts">Nenhum alerta ativo ✓</div>';
  } else {
    list.innerHTML = active.map(a=>`
      <div class="alert-item">
        <span class="alert-msg">${escHtml(a.msg)}</span>
        <button class="alert-dismiss" onclick="dismissAlert('${a.id}')">✕ Dispensar</button>
      </div>`).join('');
  }
}

function dismissAlert(id) {
  if (!cgDismissedAlerts.includes(id)) cgDismissedAlerts.push(id);
  localStorage.setItem('cgDismissedAlerts', JSON.stringify(cgDismissedAlerts));
  checkAlerts();
}

function toggleAlerts() {
  document.getElementById('alerts-panel').classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════
   SEED DEMO DATA
═══════════════════════════════════════════════════════════ */
function seedDemo() {
  const v = (base) => base * (0.85 + Math.random()*0.3);

/* ═══════════════════════════════════════════════════════════
   DASHBOARD — RENDER
═══════════════════════════════════════════════════════════ */
function renderDashboard() {
  if (!dbMonth) dbMonth = currentMonth();
  const el = document.getElementById('db-content');

  const txM    = cgTx.filter(t=>t.date&&t.date.startsWith(dbMonth));
  const saidas = txM.filter(t=>t.type==='saida');
  const entradas = txM.filter(t=>t.type==='entrada');
  const totS   = saidas.reduce((s,t)=>s+(t.value||0),0);
  const totE   = entradas.reduce((s,t)=>s+(t.value||0),0);
  const saldo  = totE - totS;
  const score  = calcScore(dbMonth);

  // Maior categoria
  const catTotals = {};
  saidas.forEach(t=>{ catTotals[t.category]=(catTotals[t.category]||0)+(t.value||0); });
  const topCat = Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];

  // Compromissos fixos
  const recM = cgTx.filter(t=>t.recorrente&&t.type==='saida');
  let totalFixo = 0;
  const fixoItems = recM.slice(0,6).map(t=>{
    let monthly = t.value||0;
    if (t.frequencia==='semanal') monthly = monthly*52/12;
    else if (t.frequencia==='anual') monthly = monthly/12;
    totalFixo += monthly;
    return `<li class="fixed-item">
      <span class="fixed-item-name">${escHtml(t.description)}</span>
      <span class="fixed-item-val">${fmt(monthly)}/mês</span>
    </li>`;
  }).join('');

  // Metas ativas
  const goalsActive = cgGoals.filter(g=>g.current<g.target).slice(0,4);
  const goalItems = goalsActive.length===0
    ? '<p style="color:var(--text2);font-size:13px">Nenhuma meta ativa</p>'
    : goalsActive.map(g=>{
      const pct = g.target>0 ? Math.min(g.current/g.target*100,100) : 0;
      const pc = pct<70?'prog-green':pct<90?'prog-yellow':'prog-red';
      return `<div class="goal-widget-item">
        <div class="goal-widget-row">
          <span class="goal-widget-name">${g.emoji||'🎯'} ${escHtml(g.name)}</span>
          <span class="goal-widget-pct">${pct.toFixed(0)}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill ${pc}" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

  // Last 8 transactions
  const last8 = [...cgTx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  const txRows = last8.length===0
    ? `<tr><td colspan="5" class="table-empty">Nenhuma transação ainda</td></tr>`
    : last8.map(t=>{
      const cat = getCat(t.category);
      const badge = t.type==='entrada'
        ? `<span class="badge badge-green">Entrada</span>`
        : `<span class="badge badge-red">Saída</span>`;
      return `<tr>
        <td>${dateDisp(t.date)}</td>
        <td>${escHtml(t.description)} ${t.recorrente?'🔄':''}</td>
        <td><span style="font-size:16px">${cat.icon}</span> ${cat.label}</td>
        <td>${badge}</td>
        <td style="font-weight:700;color:${t.type==='entrada'?'var(--green)':'var(--accent2)'}">${fmt(t.value)}</td>
      </tr>`;
    }).join('');

  const saldoClass = saldo>=0 ? 'card-positive' : 'card-negative';

  el.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">Dashboard</span>
      <select class="month-select" onchange="dbMonth=this.value;renderDashboard()">${getMonthOpts(dbMonth)}</select>
      <button class="btn btn-secondary" onclick="openModal('modal-report')">📊 Relatório</button>
      <button class="btn btn-primary" onclick="openAddTx()">+ Adicionar</button>
    </div>

    <div class="cards-grid">
      <div class="summary-card card-red">
        <div class="card-label">Total Saídas</div>
        <div class="card-value">${fmt(totS)}</div>
        <div class="card-sub">${saidas.length} transação(ões)</div>
      </div>
      <div class="summary-card card-green">
        <div class="card-label">Total Entradas</div>
        <div class="card-value">${fmt(totE)}</div>
        <div class="card-sub">${entradas.length} transação(ões)</div>
      </div>
      <div class="summary-card ${saldoClass}">
        <div class="card-label">Saldo do Período</div>
        <div class="card-value">${fmt(saldo)}</div>
        <div class="card-sub">${saldo>=0?'Positivo':'Negativo'}</div>
      </div>
      <div class="summary-card card-yellow">
        <div class="card-label">Maior Categoria</div>
        <div class="card-value">${topCat?getCat(topCat[0]).icon:'—'}</div>
        <div class="card-sub">${topCat?getCat(topCat[0]).label+' • '+fmt(topCat[1]):'Sem dados'}</div>
      </div>
    </div>

    <div class="widgets-grid">
      <div class="widget">
        <div class="widget-title">Score de Saúde Financeira</div>
        ${gaugeHTML(score)}
      </div>
      <div class="widget">
        <div class="widget-title">Compromissos Fixos</div>
        <div class="fixed-total"><span>Total mensal estimado</span><span>${fmt(totalFixo)}</span></div>
        <ul class="fixed-list">${fixoItems||'<li class="fixed-item"><span class="fixed-item-name" style="color:var(--text2)">Nenhum compromisso fixo</span></li>'}</ul>
      </div>
      <div class="widget">
        <div class="widget-title">Metas Ativas</div>
        ${goalItems}
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-box">
        <div class="chart-box-title">Evolução Mensal (12 meses)</div>
        <div class="chart-wrap"><canvas id="chart-evolution"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title">Gastos por Categoria</div>
        <div class="chart-wrap"><canvas id="chart-donut"></canvas></div>
      </div>
    </div>

    <div class="table-box">
      <div class="table-box-header">
        <h3>Últimas Transações</h3>
        <button class="btn btn-secondary btn-sm" onclick="navigate('transacoes')">Ver todas →</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th></tr></thead>
          <tbody>${txRows}</tbody>
        </table>
      </div>
    </div>`;

  // Populate report month select
  document.getElementById('report-month').innerHTML = getMonthOpts(dbMonth);

  // Build charts after DOM insert
  setTimeout(() => {
    buildEvolutionChart();
    buildDonutChart();
  }, 50);
}

function buildEvolutionChart() {
  const months = [];
  for (let i=11;i>=0;i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const dataS = months.map(m=>cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(m)).reduce((s,t)=>s+(t.value||0),0));
  const dataE = months.map(m=>cgTx.filter(t=>t.type==='entrada'&&t.date&&t.date.startsWith(m)).reduce((s,t)=>s+(t.value||0),0));
  const ctx = document.getElementById('chart-evolution');
  if (!ctx) return;
  if (charts.evolution) charts.evolution.destroy();
  charts.evolution = new Chart(ctx, {
    type:'bar',
    data:{
      labels: months.map(monthLabel),
      datasets:[
        { label:'Entradas', data:dataE, backgroundColor:'rgba(67,233,123,0.7)', borderRadius:4 },
        { label:'Saídas',   data:dataS, backgroundColor:'rgba(108,99,255,0.7)', borderRadius:4 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:12} } } },
      scales:{
        x:{ ticks:{ color:'#94a3b8', maxRotation:45 }, grid:{ color:'#2e3350' } },
        y:{ ticks:{ color:'#94a3b8', callback:v=>'R$'+v.toLocaleString('pt-BR') }, grid:{ color:'#2e3350' } }
      }
    }
  });
}

function buildDonutChart() {
  const saidas = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(dbMonth));
  const totals = {};
  saidas.forEach(t=>{ totals[t.category]=(totals[t.category]||0)+(t.value||0); });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const ctx = document.getElementById('chart-donut');
  if (!ctx) return;
  if (charts.donut) charts.donut.destroy();
  if (entries.length===0) { ctx.parentElement.innerHTML = '<p style="color:var(--text2);text-align:center;padding:60px 0">Sem gastos neste mês</p>'; return; }
  charts.donut = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: entries.map(([id])=>getCat(id).icon+' '+getCat(id).label),
      datasets:[{ data: entries.map(([,v])=>v), backgroundColor: entries.map(([id])=>getCat(id).color), borderColor:'#1a1d27', borderWidth:2 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'right', labels:{ color:'#94a3b8', font:{size:11}, boxWidth:14 } } }
    }
  });
}

function renderTransacoes() {
  const el = document.getElementById('tx-content');
  el.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">Transações</span>
      <button class="btn btn-primary" onclick="openAddTx()">+ Adicionar</button>
      <button class="btn btn-secondary" onclick="exportCSV()">⬇ Exportar CSV</button>
    </div>
    <div class="filters-row">
      <input type="text" id="tx-filter-text" placeholder="🔍 Buscar..." value="${escHtml(txFilters.text)}" oninput="txFilters.text=this.value;txPage=1;renderTxTable()">
      <select id="tx-filter-month" class="month-select" onchange="txFilters.month=this.value;txPage=1;renderTxTable()"></select>
      <select id="tx-filter-cat" class="cat-select-filter" onchange="txFilters.category=this.value;txPage=1;renderTxTable()"></select>
      <select id="tx-filter-type" onchange="txFilters.type=this.value;txPage=1;renderTxTable()">
        <option value="">Todos os tipos</option>
        <option value="saida">Saída</option>
        <option value="entrada">Entrada</option>
      </select>
    </div>
    <div class="table-box">
      <div class="table-scroll" id="tx-table-wrap"></div>
      <div id="tx-pagination" class="pagination"></div>
    </div>`;

  // populate selects
  const mSel = document.getElementById('tx-filter-month');
  mSel.innerHTML = '<option value="">Todos os meses</option>' + getMonthOpts('');
  mSel.value = txFilters.month;
  document.getElementById('tx-filter-cat').innerHTML = '<option value="">Todas categorias</option>' +
    CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
  document.getElementById('tx-filter-cat').value = txFilters.category;
  document.getElementById('tx-filter-type').value = txFilters.type;

}

function getFilteredTx() {
  return cgTx.filter(t=>{
    if (txFilters.text && !t.description.toLowerCase().includes(txFilters.text.toLowerCase())) return false;
    if (txFilters.month && !(t.date||'').startsWith(txFilters.month)) return false;
    if (txFilters.category && t.category !== txFilters.category) return false;
    if (txFilters.type && t.type !== txFilters.type) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

function renderTxTable() {
  const filtered = getFilteredTx();
  const perPage = 20;
  const total   = filtered.length;
  const pages   = Math.ceil(total/perPage) || 1;
  if (txPage > pages) txPage = pages;
  const slice = filtered.slice((txPage-1)*perPage, txPage*perPage);

  const rows = slice.length===0
    ? `<tr><td colspan="6" class="table-empty">Nenhuma transação encontrada</td></tr>`
    : slice.map(t=>{
      const cat = getCat(t.category);
      const typeBadge = t.type==='entrada'
        ? `<span class="badge badge-green">↑ Entrada</span>`
        : `<span class="badge badge-red">↓ Saída</span>`;
      const valColor = t.type==='entrada'?'var(--green)':'var(--accent2)';
      return `<tr>
        <td>${dateDisp(t.date)}</td>
        <td>${escHtml(t.description)} ${t.recorrente?'<span title="Recorrente">🔄</span>':''}</td>
        <td><span style="cursor:pointer" onclick="openEditTx('${t.id}')">${cat.icon} ${cat.label}</span></td>
        <td>${typeBadge}</td>
        <td style="font-weight:700;color:${valColor}">${fmt(t.value)}</td>
        <td style="white-space:nowrap">
          <button class="btn-icon btn-sm" onclick="openEditTx('${t.id}')" title="Editar">✏️</button>
          <button class="btn-icon btn-sm" onclick="deleteTx('${t.id}')" title="Excluir">🗑️</button>
        </td>
      </tr>`;
    }).join('');

  document.getElementById('tx-table-wrap').innerHTML = `
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Ações</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Pagination
  const from = total===0 ? 0 : (txPage-1)*perPage+1;
  const to   = Math.min(txPage*perPage, total);
  let pagHtml = `<button class="page-btn" onclick="txPage=Math.max(1,txPage-1);renderTxTable()" ${txPage<=1?'disabled':''}>‹</button>`;
  const maxBtns = 5;
  let start = Math.max(1, txPage-2), end = Math.min(pages, start+maxBtns-1);
  if (end-start<maxBtns-1) start = Math.max(1,end-maxBtns+1);
  for (let p=start;p<=end;p++) {
    pagHtml += `<button class="page-btn${p===txPage?' active':''}" onclick="txPage=${p};renderTxTable()">${p}</button>`;
  }
  pagHtml += `<button class="page-btn" onclick="txPage=Math.min(${pages},txPage+1);renderTxTable()" ${txPage>=pages?'disabled':''}>›</button>`;
  pagHtml += `<span class="page-info">${from}–${to} de ${total}</span>`;
  document.getElementById('tx-pagination').innerHTML = pagHtml;
}

function exportCSV() {
  const filtered = getFilteredTx();
  const BOM = '﻿';
  const header = 'Data;Descrição;Categoria;Tipo;Valor;Fatura;Recorrente\n';
  const rows = filtered.map(t=>[
    t.date, `"${(t.description||'').replace(/"/g,'""')}"`,
    getCat(t.category).label, t.type,
    String(t.value).replace('.',','),
    t.invoice||'', t.recorrente?'Sim':'Não'
  ].join(';')).join('\n');
  const blob = new Blob([BOM+header+rows], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gastos-${currentMonth()}.csv`;
  a.click();
  toast('CSV exportado!','success');
}

   BUDGETS PAGE
═══════════════════════════════════════════════════════════ */
function renderOrcamentos() {
  if (!orcMonth) orcMonth = currentMonth();
  const el = document.getElementById('orc-content');
  const saidas = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(orcMonth));

  const cards = CATEGORIES.filter(c=>c.id!=='financeiro').map(cat=>{
    const spent = saidas.filter(t=>t.category===cat.id).reduce((s,t)=>s+(t.value||0),0);
    const limit = cgBudgets[cat.id];
    let progHtml='', badgesHtml='', editHtml='', pctHtml='';

    if (limit) {
      const pct = Math.min(spent/limit*100,120);
      const pc  = pct<70?'prog-green':pct<90?'prog-yellow':'prog-red';
      progHtml = `<div class="progress-bar"><div class="progress-fill ${pc}" style="width:${Math.min(pct,100)}%"></div></div>`;
      pctHtml  = `<div class="budget-pct">${(spent/limit*100).toFixed(1)}% utilizado</div>`;
      if (spent/limit > 1) badgesHtml += `<span class="badge badge-red">🔴 Estourado</span>`;
      else if (spent/limit > 0.9) badgesHtml += `<span class="badge badge-yellow">⚠️ Quase no limite</span>`;
      editHtml = `<div class="budget-edit"><button class="btn btn-secondary btn-sm" onclick="openBudgetModal('${cat.id}',${limit})">✏️ Editar limite</button></div>`;
    } else {
      progHtml = `<div class="progress-bar"><div class="progress-fill prog-green" style="width:0%"></div></div>`;
      editHtml = `<div class="budget-edit"><button class="btn btn-primary btn-sm" onclick="openBudgetModal('${cat.id}',0)">+ Definir limite</button></div>`;
    }

    return `<div class="budget-card">
      <div class="budget-cat-header">
        <span class="budget-cat-icon">${cat.icon}</span>
        <span class="budget-cat-name">${cat.label}</span>
      </div>
      ${progHtml}
      <div class="budget-amounts">
        <span>Gasto: <strong>${fmt(spent)}</strong></span>
        <span>${limit?'Limite: '+fmt(limit):'Sem limite'}</span>
      </div>
      ${pctHtml}
      <div class="budget-badges">${badgesHtml}</div>
      ${editHtml}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">Orçamentos</span>
      <select class="month-select" onchange="orcMonth=this.value;renderOrcamentos()">${getMonthOpts(orcMonth)}</select>
    </div>
    <div class="budget-grid">${cards}</div>`;
}

function openBudgetModal(catId, current) {
  document.getElementById('budget-cat-id').value = catId;
  const cat = getCat(catId);
  document.getElementById('modal-budget-title').textContent = `Limite — ${cat.icon} ${cat.label}`;
  document.getElementById('budget-limit').value = current>0 ? String(current).replace('.',',') : '';
  openModal('modal-budget');
}

function saveBudgetLimit() {
  const catId = document.getElementById('budget-cat-id').value;
  const val   = parseVal(document.getElementById('budget-limit').value);
  if (!catId) return;
  if (val>0) cgBudgets[catId] = val;
  else delete cgBudgets[catId];
  saveBudgets();
  closeModal('modal-budget');
  toast('Orçamento salvo!','success');
  renderOrcamentos();
  checkAlerts();
}

/* ═══════════════════════════════════════════════════════════
   GOALS PAGE
═══════════════════════════════════════════════════════════ */
function renderMetas() {
  const el = document.getElementById('metas-content');
  const todayStr = today();

  const cards = cgGoals.length===0
    ? '<p style="color:var(--text2);font-size:14px;text-align:center;padding:40px">Nenhuma meta cadastrada ainda.</p>'
    : cgGoals.map(g=>{
      const pct  = g.target>0 ? Math.min(g.current/g.target*100,100) : 0;
      const done = g.current >= g.target;
      const late = !done && g.deadline && g.deadline < todayStr;
      const statusBadge = done
        ? `<span class="badge badge-green">✅ Concluída</span>`
        : late
          ? `<span class="badge badge-red">⏰ Atrasada</span>`
          : `<span class="badge badge-blue">🚀 Em andamento</span>`;
      const pc = pct<70?'prog-green':pct<90?'prog-yellow':'prog-red';

      // Monthly calc
      let monthlyMsg = '';
      if (!done && g.deadline) {
        const [dy,dm,dd] = g.deadline.split('-').map(Number);
        const now = new Date(); const dline = new Date(dy,dm-1,dd);
        const months = Math.max(1, Math.round((dline-now)/2592000000));
        const needed = Math.max(0,(g.target-g.current)/months);
        monthlyMsg = `<div class="goal-monthly">Faltam ${fmt(g.target-g.current)} — economize <strong>${fmt(needed)}/mês</strong> para atingir no prazo</div>`;
      }

      return `<div class="goal-card">
        <div class="goal-header">
          <span class="goal-emoji">${g.emoji||'🎯'}</span>
          <span class="goal-name">${escHtml(g.name)}</span>
          <span class="goal-status-badge">${statusBadge}</span>
        </div>

function openNewGoal() {
  document.getElementById('goal-id').value='';
  document.getElementById('modal-goal-title').textContent='Nova Meta';
  document.getElementById('goal-emoji').value='🎯';
  document.getElementById('goal-name').value='';
  document.getElementById('goal-target').value='';
  document.getElementById('goal-current').value='0';
  document.getElementById('goal-deadline').value='';
  openModal('modal-goal');
}

function openEditGoal(id) {
  const g = cgGoals.find(x=>x.id===id); if (!g) return;
  document.getElementById('goal-id').value=g.id;
  document.getElementById('modal-goal-title').textContent='Editar Meta';
  document.getElementById('goal-emoji').value=g.emoji||'🎯';
  document.getElementById('goal-name').value=g.name||'';
  document.getElementById('goal-target').value=String(g.target||0).replace('.',',');
  document.getElementById('goal-current').value=String(g.current||0).replace('.',',');
  document.getElementById('goal-deadline').value=g.deadline||'';
  openModal('modal-goal');
}

function saveGoal() {
  const id   = document.getElementById('goal-id').value;
  const name = document.getElementById('goal-name').value.trim();
  if (!name) { toast('Informe o nome da meta','error'); return; }
  const target  = parseVal(document.getElementById('goal-target').value);
  const current = parseVal(document.getElementById('goal-current').value);
  if (target<=0) { toast('Informe um valor alvo','error'); return; }
  const g = {
    id: id || uid(),
    name, emoji: document.getElementById('goal-emoji').value||'🎯',
    target, current,
    deadline: document.getElementById('goal-deadline').value,
    contributions: id ? (cgGoals.find(x=>x.id===id)||{}).contributions||[] : []
  };
  if (id) { const i=cgGoals.findIndex(x=>x.id===id); if(i>=0) cgGoals[i]=g; else cgGoals.push(g); }
  else cgGoals.push(g);
  saveGoals();
  closeModal('modal-goal');
  toast(id?'Meta atualizada':'Meta criada!','success');
  renderMetas();
  checkAlerts();
}

function deleteGoal(id) {
  if (!confirm('Excluir esta meta?')) return;
  cgGoals = cgGoals.filter(g=>g.id!==id);
  saveGoals();
  toast('Meta excluída','info');
  renderMetas();
}

function openAporte(goalId) {
  const g = cgGoals.find(x=>x.id===goalId); if(!g) return;
  document.getElementById('aporte-goal-id').value = goalId;
  document.getElementById('modal-aporte-title').textContent = `Aporte — ${g.emoji} ${g.name}`;
  document.getElementById('aporte-val').value='';
  document.getElementById('aporte-note').value='';
  openModal('modal-aporte');
}

function saveAporte() {
  const id  = document.getElementById('aporte-goal-id').value;
  const val = parseVal(document.getElementById('aporte-val').value);
  if (!val||val<=0) { toast('Informe um valor válido','error'); return; }
  const g = cgGoals.find(x=>x.id===id); if(!g) return;
  g.current = (g.current||0) + val;
  g.contributions = g.contributions||[];
  g.contributions.push({ date:today(), value:val, note:document.getElementById('aporte-note').value });
  saveGoals();
  closeModal('modal-aporte');
  toast(`Aporte de ${fmt(val)} registrado!`,'success');
  renderMetas();
  checkAlerts();
}

   ANALYSIS PAGE
═══════════════════════════════════════════════════════════ */
function renderAnalise() {
  const el = document.getElementById('analise-content');
  const cm = currentMonth(), pm = prevMonth(cm);

  // Section 1: Monthly comparison
  const saidasCm = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(cm));
  const saidasPm = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(pm));

  let totCm=0, totPm=0;
  const compRows = CATEGORIES.filter(c=>c.id!=='financeiro').map(cat=>{
    const vm = saidasCm.filter(t=>t.category===cat.id).reduce((s,t)=>s+(t.value||0),0);
    const vp = saidasPm.filter(t=>t.category===cat.id).reduce((s,t)=>s+(t.value||0),0);
    totCm+=vm; totPm+=vp;
    const diff = vm-vp;
    const pctV = vp>0?(diff/vp*100):0;
    let trend='<span class="trend-neutral">→</span>';
    if (Math.abs(pctV)>5) trend = diff>0?'<span class="trend-up">↑</span>':'<span class="trend-down">↓</span>';
    return { cat, vm, vp, diff, pctV, trend };
  }).filter(r=>r.vm>0||r.vp>0);

  const tableRows = compRows.map(r=>`<tr>
    <td>${r.cat.icon} ${r.cat.label}</td>
    <td>${fmt(r.vp)}</td>
    <td>${fmt(r.vm)}</td>
    <td style="color:${r.diff>0?'var(--accent2)':'var(--green)'}">${r.diff>0?'+':''}${fmt(r.diff)}</td>
    <td style="color:${r.diff>0?'var(--accent2)':'var(--green)'}">${r.vp>0?r.pctV.toFixed(1)+'%':'—'}</td>
    <td>${r.trend}</td>
  </tr>`).join('');
  const diffTotal = totCm-totPm;

  // Highlight cards
  const biggest = compRows.filter(r=>r.diff>0).sort((a,b)=>b.diff-a.diff)[0];
  const reduced = compRows.filter(r=>r.diff<0).sort((a,b)=>a.diff-b.diff)[0];
  const surged  = compRows.filter(r=>r.pctV>20);

  // Section 2: Category evolution chips
  if (!analysisCatSel.length) analysisCatSel = CATEGORIES.filter(c=>c.id!=='financeiro').slice(0,4).map(c=>c.id);
  const chips = CATEGORIES.filter(c=>c.id!=='financeiro').map(c=>`
    <button class="cat-filter-chip${analysisCatSel.includes(c.id)?' selected':''}"
      onclick="toggleAnalysisCat('${c.id}')">${c.icon} ${c.label}</button>`).join('');

  // Section 3: Recurring
  const recurring = cgTx.filter(t=>t.recorrente&&t.type==='saida');
  const byFreq = { mensal:[], semanal:[], anual:[] };
  recurring.forEach(t=>{ (byFreq[t.frequencia||'mensal']||byFreq.mensal).push(t); });
  let monthlyTotal = 0;
  const recHtml = Object.entries(byFreq).filter(([,arr])=>arr.length>0).map(([freq,arr])=>{
    const label = freq==='mensal'?'Mensal':freq==='semanal'?'Semanal':'Anual';
    const items = arr.map(t=>{
      let m=t.value||0;
      if(freq==='semanal') m=m*52/12;
      else if(freq==='anual') m=m/12;
      monthlyTotal+=m;
      return `<div class="fixed-item"><span class="fixed-item-name">${escHtml(t.description)}</span><span class="fixed-item-val">${fmt(t.value)}</span></div>`;
    }).join('');
    return `<div style="margin-bottom:12px"><strong style="font-size:12px;color:var(--text2)">${label}</strong><div style="margin-top:6px">${items}</div></div>`;
  }).join('');

  const totSaidasAll = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(cm)).reduce((s,t)=>s+(t.value||0),0);
  const fixPct = totSaidasAll>0 ? Math.round(monthlyTotal/totSaidasAll*100) : 0;
  const varPct = 100-fixPct;

  el.innerHTML = `
    <div class="topbar"><span class="topbar-title">Análise</span></div>

    <div class="analysis-section">
      <div class="analysis-section-title">📊 Comparativo Mensal — ${monthLabel(pm)} vs ${monthLabel(cm)}</div>
      <div class="highlight-cards">
        <div class="highlight-card">
          <div class="highlight-label">Maior Aumento</div>
          <div class="highlight-val" style="color:var(--accent2)">${biggest?biggest.cat.icon+' '+biggest.cat.label:'—'}</div>
          ${biggest?`<div style="font-size:12px;color:var(--text2)">${fmt(biggest.diff)}</div>`:''}
        </div>
        <div class="highlight-card">
          <div class="highlight-label">Maior Redução</div>
          <div class="highlight-val" style="color:var(--green)">${reduced?reduced.cat.icon+' '+reduced.cat.label:'—'}</div>
          ${reduced?`<div style="font-size:12px;color:var(--text2)">${fmt(Math.abs(reduced.diff))}</div>`:''}
        </div>
        <div class="highlight-card">
          <div class="highlight-label">Subiram +20%</div>
          <div class="highlight-val" style="color:var(--yellow)">${surged.length}</div>
          <div style="font-size:12px;color:var(--text2)">${surged.map(r=>r.cat.icon).join(' ')||'Nenhuma'}</div>
        </div>
      </div>
      <div class="table-box">
        <div class="table-scroll"><table>
          <thead><tr><th>Categoria</th><th>${monthLabel(pm)}</th><th>${monthLabel(cm)}</th><th>Diferença</th><th>Variação</th><th>Tendência</th></tr></thead>
          <tbody>${tableRows}</tbody>
          <tfoot><tr><td><strong>Total</strong></td><td>${fmt(totPm)}</td><td>${fmt(totCm)}</td><td style="color:${diffTotal>0?'var(--accent2)':'var(--green)'}">${diffTotal>0?'+':''}${fmt(diffTotal)}</td><td></td><td></td></tr></tfoot>
        </table></div>
      </div>
    </div>

    <div class="analysis-section">
      <div class="analysis-section-title">📈 Evolução por Categoria (6 meses)</div>
      <div class="cat-filter-wrap">${chips}</div>
      <div class="chart-box"><div class="chart-wrap"><canvas id="chart-catevol"></canvas></div></div>
    </div>

    <div class="analysis-section">
      <div class="analysis-section-title">🔄 Gastos Recorrentes</div>
      <div class="widget" style="margin-bottom:16px">
        <div class="fixed-total"><span>Total mensal fixo estimado</span><span>${fmt(monthlyTotal)}</span></div>
        ${recHtml||'<p style="color:var(--text2)">Nenhum gasto recorrente</p>'}
      </div>
      <div class="recurring-pie-wrap">
        <div class="css-pie-chart" style="background:conic-gradient(var(--accent) 0% ${fixPct}%, var(--surface2) ${fixPct}% 100%)"></div>
        <div class="pie-legend">
          <div class="pie-legend-item"><div class="pie-dot" style="background:var(--accent)"></div>${fixPct}% Fixos (${fmt(monthlyTotal)}/mês)</div>
          <div class="pie-legend-item"><div class="pie-dot" style="background:var(--surface2);border:1px solid var(--border)"></div>${varPct}% Variáveis</div>
        </div>
      </div>
    </div>`;

  setTimeout(()=>buildCatEvolChart(), 50);
}

function toggleAnalysisCat(id) {
  if (analysisCatSel.includes(id)) analysisCatSel = analysisCatSel.filter(c=>c!==id);
  else analysisCatSel.push(id);
  renderAnalise();
}

function buildCatEvolChart() {
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const ctx=document.getElementById('chart-catevol'); if(!ctx) return;
  if(charts.catevol) charts.catevol.destroy();
  const datasets = analysisCatSel.map(cid=>{
    const cat=getCat(cid);
    return {
      label:cat.icon+' '+cat.label,
      data:months.map(m=>cgTx.filter(t=>t.type==='saida'&&t.category===cid&&t.date&&t.date.startsWith(m)).reduce((s,t)=>s+(t.value||0),0)),
      borderColor:cat.color, backgroundColor:cat.color+'22', tension:0.4, fill:false, borderWidth:2
    };
  });
  charts.catevol = new Chart(ctx,{
    type:'line',
    data:{ labels:months.map(monthLabel), datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:11} } } },
      scales:{
        x:{ ticks:{ color:'#94a3b8' }, grid:{ color:'#2e3350' } },
        y:{ ticks:{ color:'#94a3b8', callback:v=>'R$'+v.toLocaleString('pt-BR') }, grid:{ color:'#2e3350' } }
      }
    }
  });
}
