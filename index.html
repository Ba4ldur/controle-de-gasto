<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCF – Controle Financeiro Pessoal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F172A;--surface:#1E293B;--surface2:#263248;--sidebar-bg:#111827;
  --accent:#6366F1;--accent-hover:#4F51D8;--income:#10B981;--expense:#F43F5E;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;--border:#334155;
  --radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface)}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:240px;min-width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;overflow-y:auto;transition:width .2s}
#sidebar.collapsed{width:64px;min-width:64px}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* Sidebar */
.sidebar-header{display:flex;align-items:center;gap:12px;padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-title{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden}
.sidebar-toggle{margin-left:auto;background:none;color:var(--text2);font-size:18px;padding:4px;border-radius:6px;flex-shrink:0}
.sidebar-toggle:hover{background:var(--surface2)}
nav{padding:12px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;margin-bottom:2px;color:var(--text2);font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-icon{font-size:18px;flex-shrink:0;width:20px;text-align:center}
.nav-label{font-size:0.875rem}
#sidebar.collapsed .nav-label,#sidebar.collapsed .sidebar-title{display:none}
.sidebar-section{padding:4px 12px;font-size:0.7rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 4px}
#sidebar.collapsed .sidebar-section{display:none}

/* Header */
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.topbar-title{font-size:1.1rem;font-weight:600}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.month-selector{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px}
.month-selector select{background:none;border:none;padding:0;font-size:.875rem;font-weight:500;color:var(--text)}

/* Pages */
.page{display:none;padding:24px;flex:1}
.page.active{display:block}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:.875rem;font-weight:600;color:var(--text2)}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:1fr 1fr}
.flex{display:flex}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.flex-1{flex:1}.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}

/* KPI Cards */
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.kpi-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.kpi-label{font-size:.8rem;color:var(--text2);font-weight:500;margin-bottom:4px}
.kpi-value{font-size:1.5rem;font-weight:700}
.kpi-sub{font-size:.75rem;color:var(--text3);margin-top:4px}
.positive{color:var(--income)}
.negative{color:var(--expense)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-weight:500;transition:all .15s;font-size:.875rem}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:#F43F5E22;color:var(--expense);border:1px solid #F43F5E44}
.btn-danger:hover{background:#F43F5E33}
.btn-ghost{background:none;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:.75rem;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:none}

/* Category pill */
.cat-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:.75rem;font-weight:500}

/* Progress bar */
.progress-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-close{background:none;color:var(--text2);font-size:20px;padding:4px;border-radius:6px}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.8rem;font-weight:500;color:var(--text2);margin-bottom:6px}
.form-input{width:100%}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:.875rem;display:flex;align-items:center;gap:10px;animation:slideIn .3s;box-shadow:var(--shadow);min-width:280px}
.toast.success{border-left:3px solid var(--income)}
.toast.error{border-left:3px solid var(--expense)}
.toast.info{border-left:3px solid var(--accent)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateX(110%)}}

/* Chart containers */
.chart-wrap{position:relative;height:260px}
.chart-wrap-sm{position:relative;height:180px}
.chart-wrap-lg{position:relative;height:340px}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.heatmap-cell{aspect-ratio:1;border-radius:3px;background:var(--surface2);cursor:default}
.heatmap-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:2px}
.heatmap-label{font-size:.65rem;color:var(--text3);text-align:center}

/* Score ring */
.score-ring{position:relative;width:120px;height:120px}
.score-ring svg{transform:rotate(-90deg)}
.score-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:1.8rem;font-weight:700}
.score-label{font-size:.7rem;color:var(--text2)}

/* Import zone */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:rgba(99,102,241,.06)}
.drop-icon{font-size:48px;margin-bottom:12px}
.drop-title{font-size:1.1rem;font-weight:600;margin-bottom:8px}
.drop-sub{color:var(--text2);font-size:.875rem}

/* Bank chips */
.bank-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.bank-chip{padding:6px 14px;border-radius:99px;border:1px solid var(--border);font-size:.8rem;font-weight:500}

/* Insight cards */
.insight-card{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.insight-icon{font-size:22px;flex-shrink:0}
.insight-text{font-size:.875rem;color:var(--text2);line-height:1.5}
.insight-text strong{color:var(--text)}

/* Onboarding */
.onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px}
.onboarding-icon{font-size:64px;margin-bottom:20px}
.onboarding h1{margin-bottom:12px}
.onboarding p{color:var(--text2);max-width:420px;margin-bottom:28px;line-height:1.7}
.onboarding-steps{display:flex;gap:24px;margin-bottom:32px;flex-wrap:wrap;justify-content:center}
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:180px;text-align:center}
.step-num{width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem;margin:0 auto 10px}

/* Goal card */
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.goal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.goal-amounts{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-top:6px}

/* Budget item */
.budget-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.budget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:500}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:.875rem}

/* Responsive */
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  #sidebar{width:64px;min-width:64px}
  #sidebar .nav-label,#sidebar .sidebar-title,#sidebar .sidebar-section{display:none}
  .page{padding:16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">💸</div>
      <span class="sidebar-title">FCF</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <nav>
      <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="import" onclick="navigate('import')">
        <span class="nav-icon">📤</span><span class="nav-label">Importar</span>
      </div>
      <div class="sidebar-section">Análise</div>
      <div class="nav-item" data-page="expenses" onclick="navigate('expenses')">
        <span class="nav-icon">💸</span><span class="nav-label">Para onde vai</span>
      </div>
      <div class="nav-item" data-page="income" onclick="navigate('income')">
        <span class="nav-icon">💰</span><span class="nav-label">De onde vem</span>
      </div>
      <div class="nav-item" data-page="trends" onclick="navigate('trends')">
        <span class="nav-icon">📈</span><span class="nav-label">Tendências</span>
      </div>
      <div class="sidebar-section">Planejamento</div>
      <div class="nav-item" data-page="budget" onclick="navigate('budget')">
        <span class="nav-icon">🎯</span><span class="nav-label">Orçamento</span>
      </div>
      <div class="nav-item" data-page="goals" onclick="navigate('goals')">
        <span class="nav-icon">🏆</span><span class="nav-label">Metas</span>
      </div>
      <div class="sidebar-section">Outros</div>
      <div class="nav-item" data-page="report" onclick="navigate('report')">
        <span class="nav-icon">📄</span><span class="nav-label">Relatório PDF</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="navigate('settings')">
        <span class="nav-icon">⚙️</span><span class="nav-label">Configurações</span>
      </div>
    </nav>
  </aside>

  <div id="main">
    <div id="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <div class="month-selector">
          <span>📅</span>
          <select id="month-filter" onchange="onMonthChange()"></select>
        </div>
        <button class="btn btn-primary" onclick="navigate('import')">+ Importar</button>
      </div>
    </div>
    <div id="page-dashboard" class="page active"></div>
    <div id="page-import" class="page"></div>
    <div id="page-expenses" class="page"></div>
    <div id="page-income" class="page"></div>
    <div id="page-trends" class="page"></div>
    <div id="page-budget" class="page"></div>
    <div id="page-goals" class="page"></div>
    <div id="page-report" class="page"></div>
    <div id="page-settings" class="page"></div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="modal-tx" onclick="closeModal('modal-tx')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-tx-title">Transação</h2>
      <button class="modal-close" onclick="closeModal('modal-tx')">✕</button>
    </div>
    <form id="form-tx" onsubmit="saveTx(event)">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Data</label><input type="date" id="tx-date" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Valor (negativo = despesa)</label><input type="number" id="tx-amount" step="0.01" class="form-input" required></div>
      </div>
      <div class="form-group"><label class="form-label">Descrição</label><input type="text" id="tx-desc" class="form-input" required></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Tipo</label><select id="tx-type" class="form-input" onchange="onTxTypeChange()"><option value="expense">Despesa</option><option value="income">Receita</option></select></div>
        <div class="form-group"><label class="form-label">Categoria</label><select id="tx-cat" class="form-input"></select></div>
      </div>
      <div class="form-group"><label class="form-label">Conta</label><input type="text" id="tx-account" class="form-input" placeholder="Ex: Nubank"></div>
      <div class="form-group"><label class="form-label">Notas</label><textarea id="tx-notes" class="form-input" rows="2"></textarea></div>
      <input type="hidden" id="tx-id">
      <div class="flex gap-2" style="justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-tx')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Budget Modal -->
<div class="modal-overlay" id="modal-budget" onclick="closeModal('modal-budget')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><h2>Orçamento</h2><button class="modal-close" onclick="closeModal('modal-budget')">✕</button></div>
    <form id="form-budget" onsubmit="saveBudget(event)">
      <div class="form-group"><label class="form-label">Categoria</label><select id="budget-cat" class="form-input"></select></div>
      <div class="form-group"><label class="form-label">Limite Mensal (R$)</label><input type="number" id="budget-limit" class="form-input" required step="0.01" min="1"></div>
      <input type="hidden" id="budget-id">
      <div class="flex gap-2" style="justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-budget')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Goal Modal -->
<div class="modal-overlay" id="modal-goal" onclick="closeModal('modal-goal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><h2>Meta</h2><button class="modal-close" onclick="closeModal('modal-goal')">✕</button></div>
    <form id="form-goal" onsubmit="saveGoal(event)">
      <div class="form-group"><label class="form-label">Nome</label><input type="text" id="goal-name" class="form-input" required></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Valor Alvo (R$)</label><input type="number" id="goal-target" class="form-input" required step="0.01" min="1"></div>
        <div class="form-group"><label class="form-label">Valor Atual (R$)</label><input type="number" id="goal-current" class="form-input" step="0.01" min="0" value="0"></div>
      </div>
      <div class="form-group"><label class="form-label">Prazo</label><input type="date" id="goal-deadline" class="form-input"></div>
      <input type="hidden" id="goal-id">
      <div class="flex gap-2" style="justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-goal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal-confirm" onclick="closeModal('modal-confirm')">
  <div class="modal" style="max-width:380px" onclick="event.stopPropagation()">
    <div class="modal-header"><h2 id="confirm-title">Confirmar</h2><button class="modal-close" onclick="closeModal('modal-confirm')">✕</button></div>
    <p id="confirm-msg" style="color:var(--text2);margin-bottom:20px"></p>
    <div class="flex gap-2" style="justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeModal('modal-confirm')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const KEY = 'fcf_data';

const DEFAULT_CATS = [
  {id:'alimentacao',name:'Alimentação',color:'#F97316',icon:'🍔',type:'expense'},
  {id:'transporte',name:'Transporte',color:'#3B82F6',icon:'🚗',type:'expense'},
  {id:'moradia',name:'Moradia',color:'#8B5CF6',icon:'🏠',type:'expense'},
  {id:'saude',name:'Saúde',color:'#EC4899',icon:'💊',type:'expense'},
  {id:'lazer',name:'Lazer',color:'#06B6D4',icon:'🎮',type:'expense'},
  {id:'educacao',name:'Educação',color:'#84CC16',icon:'📚',type:'expense'},
  {id:'compras',name:'Compras',color:'#F59E0B',icon:'🛍️',type:'expense'},
  {id:'assinaturas',name:'Assinaturas',color:'#A78BFA',icon:'📺',type:'expense'},
  {id:'investimentos',name:'Investimentos',color:'#10B981',icon:'📈',type:'both'},
  {id:'a_categorizar',name:'A categorizar',color:'#94A3B8',icon:'❓',type:'expense'},
  {id:'outros',name:'Outros',color:'#64748B',icon:'📦',type:'both'},
  {id:'receita',name:'Receita',color:'#10B981',icon:'💰',type:'income'},
  {id:'salario',name:'Salário',color:'#22C55E',icon:'💼',type:'income'},
  {id:'freelance',name:'Freelance',color:'#06B6D4',icon:'💻',type:'income'},
];

function loadDB(){

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function mkId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,9);}
function getCat(id){return DB.categories.find(c=>c.id===id)||{id:'outros',name:'Outros',color:'#64748B',icon:'📦'};}
function fmt(n){
  if(n===undefined||n===null||isNaN(n))return'R$ 0,00';
  const abs=Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return(n<0?'-':'')+'R$ '+abs;
}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function fmtMonth(m){
  if(!m)return'Todos';
  const[y,mo]=m.split('-');
  return['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(mo)-1]+' '+y;
}

// ─── AUTO CATEGORIZE ──────────────────────────────────────────────────────────
function autoCategorize(desc,type){
  const d=(desc||'').toLowerCase();
  // User rules first
  for(const r of DB.importRules){if(d.includes(r.keyword.toLowerCase()))return r.category;}
  // Auto rules
  for(const rule of AUTO_RULES){if(rule.kw.some(k=>d.includes(k)))return rule.cat;}
  return type==='income'?'receita':'a_categorizar';
}

// ─── SCORE ────────────────────────────────────────────────────────────────────
function calcScore(txs){
  let score=50;
  const income=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expense=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  if(income>0){const r=(income-expense)/income;if(r>0.3)score+=25;else if(r>0.1)score+=15;else if(r>0)score+=5;else score-=20;}
  if(DB.budgets.length){let ok=0;for(const b of DB.budgets){const s=txs.filter(t=>t.category===b.category&&t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);if(s<=b.limit)ok++;}score+=Math.round((ok/DB.budgets.length)*20);}
  return Math.max(0,Math.min(100,score));
}

function genInsights(txs){
  const out=[];
  const income=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expense=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const balance=income-expense;
  if(income>0){const pct=Math.round(balance/income*100);out.push(balance>=0?{icon:'💚',text:`Você guardou <strong>${pct}%</strong> da renda este mês (${fmt(balance)}). ${pct>20?'Excelente!':pct>10?'Bom ritmo.':'Tente economizar mais.'}`}:{icon:'⚠️',text:`Gastos superaram a receita em <strong>${fmt(Math.abs(balance))}</strong>. Revise seus hábitos.`});}
  const catSpend={};
  for(const t of txs.filter(t=>t.amount<0))catSpend[t.category]=(catSpend[t.category]||0)+Math.abs(t.amount);
  const topCat=Object.entries(catSpend).sort((a,b)=>b[1]-a[1])[0];
  if(topCat){const cat=getCat(topCat[0]);out.push({icon:cat.icon,text:`Maior gasto: <strong>${cat.name}</strong> com ${fmt(topCat[1])}${income>0?' ('+Math.round(topCat[1]/income*100)+'% da renda)':''}.`});}
  const unc=txs.filter(t=>t.category==='a_categorizar'&&t.amount<0).length;
  if(unc>0)out.push({icon:'❓',text:`<strong>${unc} transação(ões)</strong> sem categoria. Categorize para análises mais precisas.`});
  const dow={};
  for(const t of txs.filter(t=>t.amount<0)){const d=new Date(t.date+'T12:00:00').getDay();dow[d]=(dow[d]||0)+Math.abs(t.amount);}
  const topDay=Object.entries(dow).sort((a,b)=>b[1]-a[1])[0];
  if(topDay){const dn=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];out.push({icon:'📅',text:`Você gasta mais às <strong>${dn[topDay[0]]}s</strong> (${fmt(topDay[1])} no total do mês).`});}
  const subTotal=txs.filter(t=>t.category==='assinaturas'&&t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  if(subTotal>0)out.push({icon:'📺',text:`Assinaturas somam <strong>${fmt(subTotal)}</strong>. Revise se usa todos os serviços.`});
  return out.slice(0,5);
}

function handleFileSelect(e){handleFiles(e.target.files);}

function handleFiles(files){
  if(!files||!files.length)return;
  let pending=files.length,totalAdded=0,totalSkipped=0;
  for(const file of files){
    const reader=new FileReader();
    reader.onload=e=>{
      const{bank,rows}=parseFile(file.name,e.target.result);
      if(!rows.length){toast(`Sem transações em ${file.name}`,'error');}
      else{
        const acctName=file.name.replace(/\.[^.]+$/,'');
        const{added,skipped}=processImport(rows,bank,acctName);
        totalAdded+=added;totalSkipped+=skipped;
        let acc=DB.accounts.find(a=>a.bank===bank&&a.name===acctName);
        if(!acc)DB.accounts.push({id:mkId(),name:acctName,bank,txCount:added});
        else acc.txCount=(acc.txCount||0)+added;
      }
      pending--;
      if(pending===0){
        saveDB();buildMonthOptions();
        toast(`✅ ${totalAdded} importadas, ${totalSkipped} duplicatas ignoradas`,'success');
        renderImport();
      }
    };
    reader.readAsText(file,'UTF-8');
  }
}

function addManualTx(e){
  e.preventDefault();
  const amt=parseFloat(document.getElementById('m-amount').value);
  const date=document.getElementById('m-date').value;
  DB.transactions.unshift({id:mkId(),date,description:document.getElementById('m-desc').value,amount:amt,type:amt>=0?'income':'expense',category:document.getElementById('m-cat').value,account:document.getElementById('m-account').value||'Manual',bank:'manual',origin:'manual',month:date.slice(0,7),tags:[],notes:''});
  DB.transactions.sort((a,b)=>b.date.localeCompare(a.date));
  saveDB();buildMonthOptions();toast('Transação adicionada','success');renderImport();
}

// ─── PARSERS ──────────────────────────────────────────────────────────────────
function detectBank(fn,content){
  const f=fn.toLowerCase();
  if(f.endsWith('.ofx')||f.endsWith('.qfx'))return'ofx';
  if(content.includes('<OFX>')||content.includes('<STMTTRN>'))return'ofx';
  if(f.includes('nubank'))return'nubank';
  if(f.includes('itau')||f.includes('itaú'))return'itau';
  if(f.includes('bradesco'))return'bradesco';
  if(f.includes('bb_')||f.includes('bancodobrasil'))return'bb';
  if(f.includes('santander'))return'santander';
  if(f.includes('inter'))return'inter';
  if(f.includes('c6'))return'c6';
  const h=content.slice(0,400);
  if(h.includes('Histórico')&&h.includes('Docto'))return'itau';
  if(h.includes('Data Lançamento')&&h.includes('Descrição'))return'inter';
  return'generic';
}

function parseDate(s){
  if(!s)return null;s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;
  const m2=s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);if(m2)return`20${m2[3]}-${m2[2]}-${m2[1]}`;
  return null;
}

function normAmount(v){
  if(v===undefined||v===null||v==='')return null;
  const s=String(v).trim().replace(/\s/g,'');
  if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));
  return parseFloat(s.replace(',','.'));
}

function parseNubank(c){
  const rows=Papa.parse(c,{header:true,skipEmptyLines:true}).data;
  return rows.map(r=>{
    const date=parseDate(r.date||r.Data||r.data);
    const desc=r.title||r['Descrição']||r.description||'';
    const amt=normAmount(r.amount||r.Valor||r.value);
    if(!date||amt===null||isNaN(amt))return null;
    return{date,description:desc,amount:amt};
  }).filter(Boolean);
}

function parseItau(c){
  const lines=c.split('\n');let start=0;
  for(let i=0;i<lines.length;i++){if(lines[i].includes('Data')&&lines[i].includes('Histórico')){start=i+1;break;}}
  const rows=[];
  for(let i=start;i<lines.length;i++){
    const cols=lines[i].split(';').map(s=>s.replace(/"/g,'').trim());
    if(cols.length<4)continue;
    const date=parseDate(cols[0]);if(!date)continue;
    const desc=cols[1]||'';
    const cred=normAmount(cols[3]);const deb=normAmount(cols[4]);
    let amt=0;
    if(cred&&!isNaN(cred)&&cred!==0)amt=cred;
    else if(deb&&!isNaN(deb)&&deb!==0)amt=-Math.abs(deb);
    else continue;
    rows.push({date,description:desc,amount:amt});
  }
  return rows;
}

function parseBradesco(c){
  const lines=c.split('\n');let start=0;
  for(let i=0;i<lines.length;i++){if(lines[i].match(/data.*hist/i)){start=i+1;break;}}
  return lines.slice(start).map(l=>{
    const cols=l.split(';').map(s=>s.replace(/"/g,'').trim());
    if(cols.length<3)return null;
    const date=parseDate(cols[0]);if(!date)return null;
    const amt=normAmount(cols[cols.length-1]);
    if(amt===null||isNaN(amt))return null;
    return{date,description:cols[1]||'',amount:amt};
  }).filter(Boolean);
}

function parseBB(c){
  const lines=c.split('\n');let start=0;
  for(let i=0;i<lines.length;i++){if(/^\d{2}\/\d{2}\/\d{4}/.test(lines[i].trim())){start=i;break;}}
  return lines.slice(start).map(l=>{
    const cols=l.split(/[;\t]/).map(s=>s.replace(/"/g,'').trim());
    if(cols.length<3)return null;
    const date=parseDate(cols[0]);if(!date)return null;
    const amt=normAmount(cols[cols.length-1]);
    if(amt===null||isNaN(amt))return null;
    return{date,description:cols[1]||'',amount:amt};
  }).filter(Boolean);
}

function parseSantander(c){
  const rows=Papa.parse(c,{header:true,skipEmptyLines:true,delimiter:';'}).data;
  return rows.map(r=>{
    const date=parseDate(r.Data||r.date||r.DATA);
    const desc=r['Descrição']||r.description||r.Histórico||'';
    const amt=normAmount(r.Valor||r.value||r.VALOR);
    if(!date||amt===null||isNaN(amt))return null;
    return{date,description:desc,amount:amt};
  }).filter(Boolean);
}

function parseInter(c){
  const rows=Papa.parse(c,{header:true,skipEmptyLines:true}).data;
  return rows.map(r=>{
    const date=parseDate(r['Data Lançamento']||r.Data||r.date);
    const desc=r['Descrição']||r.Histórico||r.description||'';
    let amt=normAmount(r.Valor||r.value);
    if(!date||amt===null||isNaN(amt))return null;
    const tipo=(r.Tipo||r.tipo||'').toLowerCase();
    if(tipo.includes('debito')||tipo.includes('débito'))amt=-Math.abs(amt);
    return{date,description:desc,amount:amt};
  }).filter(Boolean);
}

function parseOFX(c){
  const txs=[];
  const re=/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
  let m;
  while((m=re.exec(c))!==null){
    const b=m[1];
    const get=t=>{const r=new RegExp(`<${t}>([^<\n]+)`).exec(b);return r?r[1].trim():'';};
    const dt=get('DTPOSTED');
    const amt=parseFloat(get('TRNAMT'));
    const memo=get('MEMO')||get('NAME')||'';
    if(!dt||isNaN(amt))continue;
    txs.push({date:`${dt.substr(0,4)}-${dt.substr(4,2)}-${dt.substr(6,2)}`,description:memo,amount:amt});
  }
  return txs;
}

function parseGeneric(c){
  const result=Papa.parse(c,{header:true,skipEmptyLines:true,dynamicTyping:true});
  const rows=result.data;if(!rows.length)return[];
  const keys=Object.keys(rows[0]);
  const dateKey=keys.find(k=>/date|data/i.test(k));
  const descKey=keys.find(k=>/desc|hist|title|name|memo/i.test(k));
  const amtKey=keys.find(k=>/amount|valor|value|vl_/i.test(k));
  if(!dateKey||!amtKey)return[];
  return rows.map(r=>{
    const date=parseDate(String(r[dateKey]||''));
    const amt=normAmount(r[amtKey]);
    if(!date||amt===null||isNaN(amt))return null;
    return{date,description:String(r[descKey]||''),amount:amt};
  }).filter(Boolean);
}

function parseFile(fn,content){
  const bank=detectBank(fn,content);
  let rows=[];
  try{
    if(bank==='ofx')rows=parseOFX(content);
    else if(bank==='nubank')rows=parseNubank(content);
    else if(bank==='itau')rows=parseItau(content);
    else if(bank==='bradesco')rows=parseBradesco(content);
    else if(bank==='bb')rows=parseBB(content);
    else if(bank==='santander')rows=parseSantander(content);
    else if(bank==='inter')rows=parseInter(content);
    else if(bank==='c6')rows=parseNubank(content);
    else rows=parseGeneric(content);
  }catch(e){console.error(e);}
  return{bank,rows};
}

function processImport(rows,bank,accountName){
  let added=0,skipped=0;
  for(const row of rows){
    if(!row.date)continue;
    const dup=DB.transactions.some(t=>t.date===row.date&&Math.abs(t.amount-row.amount)<0.01&&t.description.toLowerCase()===row.description.toLowerCase());
    if(dup){skipped++;continue;}
    const type=row.amount>=0?'income':'expense';
    DB.transactions.push({id:mkId(),date:row.date,description:row.description,amount:row.amount,type,category:autoCategorize(row.description,type),account:accountName||bank,bank,origin:'import',month:row.date.slice(0,7),tags:[],notes:''});
    added++;
  }
  DB.transactions.sort((a,b)=>b.date.localeCompare(a.date));
  saveDB();return{added,skipped};
}

function renderHeatmap(id,data,max,color){
  const el=document.getElementById(id);if(!el)return;
  const cells=[];
  for(let i=34;i>=0;i--){

    cells.push(`<div class="heatmap-cell" style="background:${v>0?color+alpha.toString(16).padStart(2,'0'):'var(--surface2)'}" title="${fmtDate(key)}: ${fmt(v)}"></div>`);
  }
  el.innerHTML=cells.join('');
}

  document.getElementById('goal-target').value=g?g.target:'';
  document.getElementById('goal-current').value=g?(g.current||0):0;
  document.getElementById('goal-deadline').value=g?(g.deadline||''):'';
  document.getElementById('goal-id').value=g?g.id:'';
  openModal('modal-goal');
}

function saveGoal(e){
  e.preventDefault();
  const id=document.getElementById('goal-id').value;
  const data={name:document.getElementById('goal-name').value,target:parseFloat(document.getElementById('goal-target').value),current:parseFloat(document.getElementById('goal-current').value)||0,deadline:document.getElementById('goal-deadline').value};
  if(id){const g=DB.goals.find(x=>x.id===id);if(g)Object.assign(g,data);}
  else DB.goals.push({id:mkId(),...data});
  saveDB();closeModal('modal-goal');renderGoals();toast('Meta salva','success');
}

function deleteGoalConf(id){confirm2('Excluir meta?','Esta ação não pode ser desfeita.',()=>{DB.goals=DB.goals.filter(g=>g.id!==id);saveDB();renderGoals();toast('Meta excluída');});}

// ─── REPORT ───────────────────────────────────────────────────────────────────
function renderReport(){
  const txs=filteredTx();
  const income=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expense=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  document.getElementById('page-report').innerHTML=`
  <div class="card" style="max-width:580px;margin:0 auto">
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:56px;margin-bottom:12px">📄</div>
      <h2 class="mb-3">Gerar Relatório PDF</h2>
      <p style="color:var(--text2);margin-bottom:24px">Relatório completo com resumo financeiro, gastos por categoria e lista de transações.</p>
    </div>
    <div class="card mb-4" style="background:var(--surface2)">
      <div class="flex justify-between mb-2"><span style="color:var(--text2)">Período</span><strong>${currentMonth?fmtMonth(currentMonth):'Todos os meses'}</strong></div>
      <div class="flex justify-between mb-2"><span style="color:var(--text2)">Transações</span><strong>${txs.length}</strong></div>
      <div class="flex justify-between mb-2"><span style="color:var(--text2)">Receitas</span><strong class="positive">${fmt(income)}</strong></div>
      <div class="flex justify-between mb-2"><span style="color:var(--text2)">Despesas</span><strong class="negative">${fmt(expense)}</strong></div>
      <div class="flex justify-between"><span style="color:var(--text2)">Saldo</span><strong style="color:${income-expense>=0?'var(--income)':'var(--expense)'}">${fmt(income-expense)}</strong></div>
    </div>
    <button class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;justify-content:center" onclick="generatePDF()">📥 Baixar PDF</button>
  </div>`;
}

function generatePDF(){
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF('p','mm','a4');
    const txs=filteredTx();
    const income=txs.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
    const expense=txs.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
    const balance=income-expense;
    const period=currentMonth?fmtMonth(currentMonth):'Todos os períodos';

    doc.setFillColor(99,102,241);doc.rect(0,0,210,42,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(22);doc.setFont('helvetica','bold');
    doc.text('FCF – Controle Financeiro',105,16,{align:'center'});
    doc.setFontSize(11);doc.setFont('helvetica','normal');
    doc.text(`Relatório: ${period}`,105,26,{align:'center'});
    doc.text(`Gerado em ${fmtDate(new Date().toISOString().slice(0,10))}`,105,34,{align:'center'});

    let y=54;
    doc.setTextColor(30,41,59);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('Resumo Financeiro',14,y);y+=8;

    [[fmt(income),'Receitas',[16,185,129]],[fmt(expense),'Despesas',[244,63,94]],[fmt(balance),balance>=0?'Saldo Positivo':'Saldo Negativo',balance>=0?[16,185,129]:[244,63,94]]].forEach(([val,lbl,col],i)=>{
      const x=14+i*64;
      doc.setFillColor(col[0],col[1],col[2],20);doc.roundedRect(x,y,60,22,3,3,'F');
      doc.setTextColor(120,120,120);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text(lbl,x+5,y+8);
      doc.setTextColor(...col);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(val,x+5,y+17);
    });
    y+=32;

    doc.setTextColor(30,41,59);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('Gastos por Categoria',14,y);y+=8;
    const catSpend={};
    for(const t of txs.filter(t=>t.amount<0))catSpend[t.category]=(catSpend[t.category]||0)+Math.abs(t.amount);
    const sorted=Object.entries(catSpend).sort((a,b)=>b[1]-a[1]).slice(0,8);
    for(const[id,v] of sorted){
      if(y>260){doc.addPage();y=20;}
      const cat=getCat(id);
      doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);doc.text(`${cat.icon} ${cat.name}`,14,y);
      doc.setTextColor(30,41,59);doc.setFont('helvetica','bold');doc.text(fmt(v),196,y,{align:'right'});
      const pct=expense>0?v/expense:0;
      doc.setFillColor(220,220,235);doc.rect(14,y+1,150,3,'F');
      doc.setFillColor(99,102,241);doc.rect(14,y+1,150*pct,3,'F');
      y+=10;
    }

    if(txs.length){
      if(y>230){doc.addPage();y=20;}
      y+=4;
      doc.setTextColor(30,41,59);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('Transações',14,y);y+=8;
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(100,100,100);
      doc.text('DATA',14,y);doc.text('DESCRIÇÃO',35,y);doc.text('CATEGORIA',125,y);doc.text('VALOR',196,y,{align:'right'});
      y+=2;doc.setFillColor(220,220,235);doc.rect(14,y,182,0.5,'F');y+=5;
      for(const t of txs.slice(0,50)){
        if(y>272){doc.addPage();y=20;}
        const cat=getCat(t.category);
        doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(60,60,60);
        doc.text(fmtDate(t.date),14,y);
        doc.text(t.description.slice(0,48),35,y);
        doc.text(cat.name,125,y);
        t.amount>=0?doc.setTextColor(16,185,129):doc.setTextColor(244,63,94);
        doc.setFont('helvetica','bold');doc.text(fmt(t.amount),196,y,{align:'right'});
        y+=6;
      }
      if(txs.length>50){doc.setTextColor(150,150,150);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text(`...e mais ${txs.length-50} transações`,14,y);}
    }

    doc.save(`FCF-${currentMonth||'completo'}-${new Date().toISOString().slice(0,10)}.pdf`);
    toast('PDF gerado!','success');
  }catch(e){console.error(e);toast('Erro ao gerar PDF: '+e.message,'error');}
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────────
function renderSettings(){
  document.getElementById('page-settings').innerHTML=`
  <div style="max-width:680px">
    <div class="card mb-4">
      <h3 class="mb-3">Contas / Bancos</h3>
      ${DB.accounts.length?`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Banco</th><th>Tx</th><th></th></tr></thead><tbody>
        ${DB.accounts.map(a=>`<tr><td>${a.name}</td><td>${a.bank}</td><td>${a.txCount||0}</td><td><button class="btn btn-danger btn-sm" onclick="deleteAccountConf('${a.id}')">Excluir</button></td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty"><p>Nenhuma conta ainda</p></div>`}
    </div>
    <div class="card mb-4">
      <h3 class="mb-3">Regras de Categorização</h3>
      ${DB.importRules.map(r=>`<div class="flex items-center justify-between mb-2" style="padding:8px;background:var(--surface2);border-radius:6px">
        <span><strong>${r.keyword}</strong> → ${getCat(r.category).icon} ${getCat(r.category).name}</span>
        <button class="btn btn-ghost btn-sm" onclick="deleteRuleConf('${r.id}')">🗑️</button>
      </div>`).join('')||`<div style="color:var(--text2);font-size:.875rem;margin-bottom:12px">Nenhuma regra personalizada. As regras automáticas ainda se aplicam.</div>`}
      <form class="flex gap-2 mt-3" onsubmit="addRule(event)">
        <input type="text" id="rule-kw" class="form-input flex-1" placeholder="Palavra-chave" required>
        <select id="rule-cat" class="form-input" style="width:180px">${DB.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select>
        <button type="submit" class="btn btn-primary">+ Adicionar</button>
      </form>
    </div>
    <div class="card mb-4">
      <h3 class="mb-3">Backup e Restauração</h3>
      <div class="flex gap-3 flex-wrap">
        <button class="btn btn-secondary" onclick="exportData()">📤 Exportar JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import-bk').click()">📥 Restaurar backup</button>
        <input type="file" id="import-bk" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>
    <div class="card" style="border-color:#F43F5E44">
      <h3 class="mb-3" style="color:var(--expense)">Zona de Perigo</h3>
      <p style="color:var(--text2);font-size:.875rem;margin-bottom:16px">Faça backup antes de prosseguir. Essas ações são irreversíveis.</p>
      <div class="flex gap-3">
        <button class="btn btn-danger" onclick="clearTxConf()">🗑️ Limpar transações</button>
        <button class="btn btn-danger" onclick="resetAllConf()">⚠️ Resetar tudo</button>
      </div>
    </div>
  </div>`;
}

function deleteAccountConf(id){confirm2('Excluir conta?','As transações serão mantidas.',()=>{DB.accounts=DB.accounts.filter(a=>a.id!==id);saveDB();renderSettings();toast('Conta excluída');});}
function addRule(e){e.preventDefault();const kw=document.getElementById('rule-kw').value.trim().toLowerCase();const cat=document.getElementById('rule-cat').value;if(!kw)return;DB.importRules.push({id:mkId(),keyword:kw,category:cat});saveDB();renderSettings();toast('Regra adicionada','success');}
function deleteRuleConf(id){DB.importRules=DB.importRules.filter(r=>r.id!==id);saveDB();renderSettings();}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fcf-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Backup exportado','success');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{DB=JSON.parse(ev.target.result);saveDB();buildMonthOptions();toast('Dados restaurados','success');renderCurrentPage();}catch{toast('Arquivo inválido','error');}};r.readAsText(f);}
function clearTxConf(){confirm2('Limpar transações?','Todos os extratos importados serão apagados.',()=>{DB.transactions=[];DB.accounts=[];saveDB();buildMonthOptions();toast('Transações removidas');renderCurrentPage();});}
function resetAllConf(){confirm2('Resetar TUDO?','Todos os dados serão apagados permanentemente.',()=>{DB={transactions:[],categories:[...DEFAULT_CATS],budgets:[],goals:[],accounts:[],importRules:[],settings:{currency:'BRL',dateFormat:'DD/MM/YYYY'}};saveDB();buildMonthOptions();toast('Dados resetados');navigate('dashboard');});}

// ─── TX CRUD ──────────────────────────────────────────────────────────────────
function editTx(id){
  const t=DB.transactions.find(x=>x.id===id);if(!t)return;
  document.getElementById('tx-cat').innerHTML=DB.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  document.getElementById('tx-date').value=t.date;
  document.getElementById('tx-amount').value=t.amount;
  document.getElementById('tx-desc').value=t.description;
  document.getElementById('tx-type').value=t.type;
  document.getElementById('tx-cat').value=t.category;
  document.getElementById('tx-account').value=t.account||'';
  document.getElementById('tx-notes').value=t.notes||'';
  document.getElementById('tx-id').value=t.id;
  document.getElementById('modal-tx-title').textContent='Editar Transação';
  openModal('modal-tx');
}

function saveTx(e){
  e.preventDefault();
  const id=document.getElementById('tx-id').value;
  const t=DB.transactions.find(x=>x.id===id);
  const date=document.getElementById('tx-date').value;
  const data={date,description:document.getElementById('tx-desc').value,amount:parseFloat(document.getElementById('tx-amount').value),type:document.getElementById('tx-type').value,category:document.getElementById('tx-cat').value,account:document.getElementById('tx-account').value,notes:document.getElementById('tx-notes').value,month:date.slice(0,7)};
  if(t)Object.assign(t,data);
  saveDB();closeModal('modal-tx');renderCurrentPage();toast('Transação salva','success');
}

function deleteTxConf(id){confirm2('Excluir transação?','Esta ação não pode ser desfeita.',()=>{DB.transactions=DB.transactions.filter(t=>t.id!==id);saveDB();renderCurrentPage();toast('Transação excluída');});}
function onTxTypeChange(){const type=document.getElementById('tx-type').value;document.getElementById('tx-cat').innerHTML=DB.categories.filter(c=>c.type==='both'||(type==='income'?c.type==='income':c.type!=='income')).map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');}

// ─── MODALS & TOAST ───────────────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function confirm2(title,msg,cb){document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-msg').textContent=msg;document.getElementById('confirm-ok').onclick=()=>{closeModal('modal-confirm');cb();};openModal('modal-confirm');}
function toast(msg,type='info'){
  const t=document.createElement('div');t.className=`toast ${type}`;
  t.innerHTML=`<span>${{success:'✅',error:'❌',info:'ℹ️'}[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>{t.style.animation='fadeOut .3s forwards';setTimeout(()=>t.remove(),300);},3500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));});

loadDB();
buildMonthOptions();
document.getElementById('tx-cat').innerHTML=DB.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
renderDashboard();
</script>
</body>
