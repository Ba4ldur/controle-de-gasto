function buildFinContext() {
  const cm = currentMonth();
  const txM = cgTx.filter(t=>t.date&&t.date.startsWith(cm));
  const saidas = txM.filter(t=>t.type==='saida');
  const entradas = txM.filter(t=>t.type==='entrada');
  const totS = saidas.reduce((s,t)=>s+(t.value||0),0);
  const totE = entradas.reduce((s,t)=>s+(t.value||0),0);
  const catTotals={};
  saidas.forEach(t=>{ catTotals[t.category]=(catTotals[t.category]||0)+(t.value||0); });
  const top5 = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([id,v])=>getCat(id).label+': '+fmt(v)).join(', ');
  const budgetsOver = Object.entries(cgBudgets).filter(([id,l])=>{
    const s=saidas.filter(t=>t.category===id).reduce((s,t)=>s+(t.value||0),0);
    return s>l;
  }).map(([id])=>getCat(id).label).join(', ');
  const goalsInfo = cgGoals.map(g=>{
    const pct=(g.target>0?g.current/g.target*100:0).toFixed(0);
    return `${g.name}: ${pct}% (prazo: ${g.deadline||'indefinido'})`;
  }).join('; ');

  return `[Contexto financeiro - ${monthLabel(cm)}]
Entradas: ${fmt(totE)} | Saídas: ${fmt(totS)} | Saldo: ${fmt(totE-totS)}
Top 5 categorias: ${top5||'sem dados'}
Orçamentos estourados: ${budgetsOver||'nenhum'}
Score de saúde: ${calcScore()}/100
Metas: ${goalsInfo||'nenhuma'}`;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  if (!cgApiKey) { toast('Configure sua API Key primeiro','error'); return; }
  input.value='';
  chatHistory.push({ role:'user', content:msg });
  renderIA();

  // Typing indicator
  const chatEl = document.getElementById('chat-messages');
  const typing = document.createElement('div');
  typing.className='chat-msg assistant';
  typing.innerHTML='<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  chatEl.appendChild(typing);
  chatEl.scrollTop=chatEl.scrollHeight;

  const SYSTEM_PROMPT = `Você é um consultor financeiro pessoal brasileiro, direto e prático.
Analise os dados fornecidos e dê conselhos concretos em português.
Foque em: cortes desnecessários, hábitos a melhorar, como atingir metas.
Use valores em R$. Seja objetivo, máximo 200 palavras por resposta.`;

  const hist = chatHistory.slice(-10).map(m=>({
    role: m.role==='user'?'user':'assistant',
    content: m.role==='user' && m===chatHistory[chatHistory.length-1]
      ? buildFinContext()+'\n\nPergunta: '+m.content : m.content
  }));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': cgApiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:SYSTEM_PROMPT, messages:hist })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message||'Erro na API');
    const reply = data.content?.[0]?.text||'Sem resposta';
    chatHistory.push({ role:'assistant', content:reply });
  } catch(err) {
    chatHistory.push({ role:'assistant', content:`❌ Erro: ${err.message}` });
  }

  if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
  renderIA();
}

function sendChip(text) {
  const inp = document.getElementById('chat-input');
  if (inp) { inp.value=text; sendChat(); }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
}

function handleFiles(files) {
  if (!files||!files.length) return;
  const file = files[0];
  if (file.name.endsWith('.csv')) parseCSV(file);
  else if (file.name.endsWith('.pdf')) parsePDF(file);
  else toast('Formato não suportado (use CSV ou PDF)','error');
}

function parseCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const sep  = text.includes(';') ? ';' : ',';
    const lines= text.split('\n').map(l=>l.trim()).filter(Boolean);
    const header = lines[0].toLowerCase().split(sep);
    const getIdx = (...keys) => { for(const k of keys){ const i=header.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
    const di=getIdx('data','date'), dsi=getIdx('descrição','descricao','titulo','title','memo'), vi=getIdx('valor','value','amount');

    importParsed = [];
    for (let i=1;i<lines.length;i++) {
      const cols = splitCSVLine(lines[i], sep);
      if (!cols[vi]) continue;
      const raw = cols[vi].replace(/[R$\s"]/g,'').trim();
      const num = parseFloat(raw.replace(',','.'));
      if (isNaN(num)) continue;
      const val  = Math.abs(num);
      const type = num < 0 ? 'saida' : 'entrada';
      const desc = (cols[dsi]||'').replace(/^"|"$/g,'').trim() || 'Importado';
      const dateRaw = (cols[di]||'').replace(/^"|"$/g,'').trim();
      const date = normalizeDate(dateRaw) || today();
      importParsed.push({ date, description:desc, value:val, type, category:'outros', invoiceId:file.name });
    }
    showPreview(file.name);
  };
  reader.readAsText(file, 'utf-8');
}

function splitCSVLine(line, sep) {
  const result=[]; let cur='', inQ=false;
  for(const ch of line){
    if(ch==='"') inQ=!inQ;
    else if(ch===sep&&!inQ){ result.push(cur); cur=''; }
    else cur+=ch;
  }
  result.push(cur); return result;
}

function normalizeDate(raw) {
  if (!raw) return null;
  const parts = raw.split(/[\/\-\.]/);
  if (parts.length===3) {
    const [a,b,c]=parts;
    if (a.length===4) return `${a}-${b.padStart(2,'0')}-${c.padStart(2,'0')}`;
    if (c.length===4) return `${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
    return `20${c.padStart(2,'0')}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
  }
  return null;
}

async function parsePDF(file) {
  toast('Processando PDF...','info');
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let allText = '';
    for (let p=1;p<=pdf.numPages;p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      allText += content.items.map(i=>i.str).join(' ') + '\n';
    }
    // Regex for Nubank pattern: DD MMM YYYY Description R$ X.XXX,XX
    const months_map = {jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12'};
    const re = /(\d{2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\.?\s+(\d{4})\s+(.+?)\s+R\$\s*([\d.,]+)/gi;
    importParsed = [];
    let m;
    while ((m=re.exec(allText))!==null) {
      const mon = months_map[(m[2]||'').toLowerCase()]||'01';
      const date = `${m[3]}-${mon}-${m[1].padStart(2,'0')}`;
      const val  = parseVal(m[5]);
      if (val>0) importParsed.push({ date, description:m[4].trim(), value:val, type:'saida', category:'outros', invoiceId:file.name });
    }
    if (!importParsed.length) toast('Nenhuma transação encontrada no PDF','error');
    else showPreview(file.name);
  } catch(err) { toast('Erro ao processar PDF: '+err.message,'error'); }
}

function showPreview(fname) {
  const total = importParsed.reduce((s,t)=>s+(t.value||0),0);
  document.getElementById('preview-filename').textContent = '📄 ' + fname;
  document.getElementById('preview-count').textContent = importParsed.length;
  document.getElementById('preview-total').textContent = fmt(total);
  document.getElementById('import-btn').textContent = `Importar ${importParsed.length} transações`;
  const rows = importParsed.slice(0,10).map(t=>`<tr>
    <td>${dateDisp(t.date)}</td><td>${escHtml(t.description)}</td>
    <td>${fmt(t.value)}</td>
    <td>${t.type==='entrada'?'<span class="badge badge-green">Entrada</span>':'<span class="badge badge-red">Saída</span>'}</td>
  </tr>`).join('');
  document.getElementById('preview-rows').innerHTML = rows;
  document.getElementById('invoice-preview').classList.add('show');
}

function doImport() {
  let imported=0, dupes=0;
  importParsed.forEach(t=>{
    const isDupe = cgTx.some(x=>x.date===t.date&&x.description===t.description&&x.value===t.value);
    if (isDupe) { dupes++; return; }
    cgTx.push({ ...t, id:uid(), invoice:t.invoiceId||'', recorrente:false, frequencia:null });
    imported++;
  });
  save();
  cgInvoices.push({ name:importParsed[0]?.invoiceId||'Fatura', count:imported, total:importParsed.reduce((s,t)=>s+(t.value||0),0), importedAt:today() });
  saveInvoices();
  toast(`${imported} transações importadas, ${dupes} duplicatas ignoradas`,'success');
  importParsed=[];
  document.getElementById('invoice-preview').classList.remove('show');
  renderImportar();
}

function addManualTx() {
  const date = document.getElementById('imp-date').value;
  const desc = document.getElementById('imp-desc').value.trim();
  const val  = parseVal(document.getElementById('imp-val').value);
  if (!date||!desc||!val) { toast('Preencha todos os campos obrigatórios','error'); return; }
  cgTx.push({ id:uid(), date, description:desc, value:val,
    type:document.getElementById('imp-type').value,
    category:document.getElementById('imp-cat').value,
    invoice:'manual', invoiceId:null, recorrente:false, frequencia:null });
  save();
  toast('Transação adicionada!','success');
  document.getElementById('imp-desc').value='';
  document.getElementById('imp-val').value='';
}

function renderCategorias() {
  if (!catMonth) catMonth = currentMonth();

  const saidas = cgTx.filter(t=>t.type==='saida'&&t.date&&t.date.startsWith(catMonth));

  const cards = CATEGORIES.filter(c=>c.id!=='financeiro').map(cat=>{
    const txCat = saidas.filter(t=>t.category===cat.id);
    const total = txCat.reduce((s,t)=>s+(t.value||0),0);
    const pct   = totalGeral>0 ? (total/totalGeral*100) : 0;
    return `<div class="cat-card">
      <div class="cat-icon-big">${cat.icon}</div>

      <div class="cat-val">${fmt(total)}</div>
