{% extends "base.html" %}
{% block page %}importacoes{% endblock %}
{% block conteudo %}
<h1>Importações</h1>
<p class="subtitulo">Histórico de arquivos importados, com linhas novas,
  duplicadas e rejeitadas.</p>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Arquivo</th>
        <th>Formato</th>
        <th>Período</th>
        <th class="num">Importadas</th>
        <th class="num">Duplicadas</th>
        <th class="num">Rejeitadas</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody id="corpo-importacoes"></tbody>
  </table>
</div>
{% endblock %}
