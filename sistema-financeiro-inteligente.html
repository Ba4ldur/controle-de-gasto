   RELATÓRIOS PDF
   ============================================================ */
const PDF_CONFIG={
  pageWidth:210, pageHeight:297,
  margin:{top:20, right:15, bottom:20, left:15},
  contentWidth:180,
  colors:{
    background:[10,15,30], cardBg:[17,24,39], accent:[99,102,241],
    income:[16,185,129], expense:[244,63,94], warning:[245,158,11],
    textPrimary:[241,245,249], textSecondary:[148,163,184],
    textTertiary:[71,85,105], border:[30,41,59], white:[255,255,255]
  }
};

function formatCurrencyBR(v){ return fmtMoney(v); }
function formatDateBR(d){ return fmtDate(d); }
function formatMonthBR(m){ return fmtMonthLong(m); }
function generateFileName(config){ return (config.fileName||`sfi_${config.type}_${Date.now()}`)+'.pdf'; }

function addPdfHeader(doc,title,subtitle,periodLabel){
  const {colors:C,margin:M}=PDF_CONFIG;
  doc.setFillColor(...C.accent); doc.rect(0,0,210,12,'F');
  doc.setTextColor(...C.white); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('SISTEMA FINANCEIRO INTELIGENTE',M.left,8);
  doc.setFont('helvetica','normal'); doc.text(new Date().toLocaleDateString('pt-BR'),195,8,{align:'right'});
  doc.setFillColor(...C.background); doc.rect(0,12,210,40,'F');
  doc.setFontSize(20); doc.setFont('helvetica','bold'); doc.setTextColor(...C.white);
  doc.text(title,M.left,28);
  if(subtitle){ doc.setFontSize(11); doc.setFont('helvetica','normal'); doc.setTextColor(...C.textSecondary); doc.text(subtitle,M.left,38); }
  if(periodLabel){ doc.setFontSize(10); doc.setTextColor(...C.accent); doc.text(periodLabel,M.left,48); }
  return 58;
}
function addPdfFooter(doc,pageNumber,totalPages){
  const {colors:C,pageHeight:PH,margin:M}=PDF_CONFIG;
  doc.setFillColor(...C.cardBg); doc.rect(0,PH-10,210,10,'F');
  doc.setFontSize(8); doc.setTextColor(...C.textTertiary); doc.setFont('helvetica','normal');
  doc.text(`Sistema Financeiro Inteligente — sfi.html`,M.left,PH-3.5);
  doc.text(`Página ${pageNumber} de ${totalPages}`,195,PH-3.5,{align:'right'});
}
function addSectionTitle(doc,title,y){
  const {colors:C,margin:M}=PDF_CONFIG;
  doc.setFillColor(...C.cardBg); doc.rect(M.left,y,PDF_CONFIG.contentWidth,8,'F');
  doc.setTextColor(...C.accent); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  doc.text(title.toUpperCase(),M.left+3,y+5.5);
  return y+14;
}
function addSummaryCards(doc,totals,y){
  const {colors:C,margin:M,contentWidth:CW}=PDF_CONFIG;
  const cw=(CW-8)/3; const cards=[
    {label:'Entradas',value:totals.income,color:C.income},
    {label:'Saídas',value:totals.expenses,color:C.expense},
    {label:'Saldo',value:totals.net,color:totals.net>=0?C.income:C.expense}
  ];
  cards.forEach((card,i)=>{
    const x=M.left+i*(cw+4);
    doc.setFillColor(...C.cardBg); doc.roundedRect(x,y,cw,22,2,2,'F');
    doc.setTextColor(...C.textSecondary); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text(card.label,x+3,y+7);
    doc.setTextColor(...card.color); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(formatCurrencyBR(card.value),x+3,y+17);
  });
  return y+30;
}
function checkPageBreak(doc,currentY,requiredSpace){
  if(currentY+requiredSpace > PDF_CONFIG.pageHeight-PDF_CONFIG.margin.bottom-10){
    doc.addPage(); return PDF_CONFIG.margin.top;
  }
  return currentY;
}
function addSimpleTable(doc,columns,rows,y,options={}){
  const {colors:C,margin:M,contentWidth:CW}=PDF_CONFIG;
  const colW=options.colWidths||columns.map(()=>CW/columns.length);
  // header
  doc.setFillColor(...C.accent); doc.rect(M.left,y,CW,7,'F');
  doc.setTextColor(...C.white); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  let x=M.left;
  columns.forEach((col,i)=>{ doc.text(col,x+2,y+5,{maxWidth:colW[i]-4}); x+=colW[i]; });
  y+=7;
  rows.forEach((row,ri)=>{
    y=checkPageBreak(doc,y,8);
    const bg=ri%2===0?C.cardBg:C.background;
    doc.setFillColor(...bg); doc.rect(M.left,y,CW,7,'F');
    doc.setTextColor(...C.textPrimary); doc.setFont('helvetica','normal'); doc.setFontSize(7);
    x=M.left;
    row.forEach((cell,ci)=>{
      const align=options.align?.[ci]||'left';
      const tx=align==='right'?x+colW[ci]-2:x+2;
      doc.text(String(cell??''),tx,y+5,{align,maxWidth:colW[ci]-4});
      x+=colW[ci];
    });
    y+=7;
  });
  return y+4;
}

async function generatePdfReport(config){
  const {jsPDF}=window.jspdf;
  if(!jsPDF){ showToast('jsPDF não carregado','error'); return; }
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  doc.setFillColor(...PDF_CONFIG.colors.background); doc.rect(0,0,210,297,'F');
  const totals=config.totals||calculateTotals(config.transactions);
  let y=addPdfHeader(doc,config.title,config.subtitle,config.filters?.startDate?`${formatDateBR(config.filters.startDate)} a ${formatDateBR(config.filters.endDate)}`:config.filters?.month?formatMonthBR(config.filters.month):'');
  y=addSummaryCards(doc,totals,y); y+=4;

  // Categorias
  const cats=config.categorySummary||buildCategorySummary(config.transactions);
  if(cats.length){
    y=checkPageBreak(doc,y,20);
    y=addSectionTitle(doc,'Gastos por categoria',y);
    y=addSimpleTable(doc,['Categoria','Transações','Total','%'],
      cats.slice(0,12).map(c=>[c.category,c.count,formatCurrencyBR(c.total),c.percentage.toFixed(1)+'%']),
      y,{colWidths:[65,30,50,35],align:['left','right','right','right']});
  }

  // Tabela de transações
  if(config.includeFullTable && config.transactions.length){
    y=checkPageBreak(doc,y,20);
    y=addSectionTitle(doc,'Transações',y);
    y=addSimpleTable(doc,['Data','Descrição','Categoria','Valor'],
      config.transactions.slice(0,80).map(t=>[formatDateBR(t.date),truncate(t.description,34),t.category,`${t.amount>=0?'+':''}${formatCurrencyBR(Math.abs(t.amount))}`]),
      y,{colWidths:[22,75,40,43],align:['left','left','left','right']});
  }

  // Orçamentos
  if(config.type==='budget' && config.budgets?.length){
    y=checkPageBreak(doc,y,20);
    y=addSectionTitle(doc,'Orçamentos',y);
    const m=config.filters?.month||currentMonth();
    const txsM=inMonth(m);
    y=addSimpleTable(doc,['Categoria','Limite','Gasto','Utilizado'],
      config.budgets.map(b=>{
        const spent=byCategory(txsM).find(c=>c.category===b.category)?.total||0;
        return [b.category,formatCurrencyBR(b.limit),formatCurrencyBR(spent),(b.limit>0?(spent/b.limit*100).toFixed(0)+'%':'—')];
      }),y,{colWidths:[55,40,40,45],align:['left','right','right','right']});
  }

  // Objetivos
  if(config.type==='goals' && config.goals?.length){
    y=checkPageBreak(doc,y,20);
    y=addSectionTitle(doc,'Objetivos',y);
    y=addSimpleTable(doc,['Objetivo','Meta','Guardado','Progresso'],
      config.goals.map(g=>[g.name,formatCurrencyBR(g.target),formatCurrencyBR(g.saved),(g.target>0?(g.saved/g.target*100).toFixed(0)+'%':'0%')]),
      y,{colWidths:[60,40,40,40],align:['left','right','right','right']});
  }

  // rodapé em todas as páginas
  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){ doc.setPage(i); addPdfFooter(doc,i,totalPages); }
  doc.save(generateFileName(config));
  showToast('PDF gerado com sucesso','success');
}

function exportTransactionsToCSV(txs, fileName){

      body:`<div class="row"><div class="field"><label>De</label><input class="input" type="date" id="rStart" value="${currentMonth()}-01"></div>
      <div class="field"><label>Até</label><input class="input" type="date" id="rEnd" value="${todayISO()}"></div></div>`,
      buttons:[{label:'Cancelar'},{label:'Gerar PDF',class:'btn-primary',onClick:()=>{
        const s=document.getElementById('rStart').value, e=document.getElementById('rEnd').value;
        if(!s||!e){ showToast('Preencha as datas','warning'); return false; }
        const txs=DATA.transactions.filter(t=>t.date>=s&&t.date<=e);
        generatePdfReport({title:'Relatório por Período',subtitle:`${formatDateBR(s)} a ${formatDateBR(e)}`,
          type:'period',filters:{startDate:s,endDate:e},transactions:txs,
          totals:calculateTotals(txs),categorySummary:buildCategorySummary(txs),
          includeFullTable:true,fileName:`periodo_${s}_${e}`});
      }}]});
  } else if(type==='budget'){
    generatePdfReport({title:'Orçamentos',subtitle:fmtMonthLong(currentMonth()),type:'budget',
      filters:{month:currentMonth()},transactions:inMonth(currentMonth()),
      budgets:DATA.budgets,totals:calculateTotals(inMonth(currentMonth())),
      categorySummary:buildCategorySummary(inMonth(currentMonth())),includeFullTable:false,
      fileName:`orcamentos_${currentMonth()}`});
  } else if(type==='goals'){
    generatePdfReport({title:'Objetivos Financeiros',subtitle:'Progresso das metas',type:'goals',
      filters:{},transactions:[],goals:DATA.goals,
      totals:{income:0,expenses:0,net:0,count:DATA.goals.length},
      categorySummary:[],includeFullTable:false,
      fileName:`objetivos_${todayISO()}`});
  }
}

/* ============================================================
   VIEW: AJUSTES
   ============================================================ */
VIEWS.ajustes = function(el){
  const s=DATA.settings;
  el.innerHTML=`
  <div class="grid g2">
    <div>
      <div class="card">
        <div class="card-title">${ICONS.spark} Consultor IA</div>
        <div class="field"><label>Anthropic API Key</label>
          <div class="input-group">
            <input class="input" id="apiKey" type="password" placeholder="sk-ant-..." value="${escapeHtml(s.apiKey||'')}">
            <button class="toggle-eye" onclick="toggleEye(this)" style="background:none;border:none;cursor:pointer">${ICONS.info}</button>
          </div>
          <p class="tiny muted" style="margin-top:6px">Opcional. Usada apenas para enriquecer respostas. Fica salva só no seu navegador.</p>
        </div>
        <div class="flex gap" style="align-items:center;margin-bottom:14px">
          <label style="font-size:13px;font-weight:500">Desativar IA</label>
          <input type="checkbox" id="aiDisabled" ${s.aiDisabled?'checked':''}>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">${ICONS.check} Salvar configurações</button>
      </div>
      <div class="card mt2">
        <div class="card-title">${ICONS.settings} Geral</div>
        <div class="field"><label>Início do ciclo mensal (dia)</label>
          <input class="input" id="monthStart" type="number" min="1" max="28" value="${s.monthStart||1}">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">${ICONS.check} Salvar</button>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-title">${ICONS.wallet} Dados</div>
        <p class="tiny muted mb">${DATA.transactions.length} transações · ${DATA.budgets.length} orçamentos · ${DATA.goals.length} objetivos · ${DATA.learnedRules.length} regras aprendidas</p>
        <div class="grid" style="gap:8px">
          <button class="btn btn-ghost" onclick="backupData()">${ICONS.download} Exportar backup JSON</button>
          <button class="btn btn-ghost" onclick="document.getElementById('restoreFile').click()">${ICONS.upload} Restaurar backup</button>
          <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(this)">
          <button class="btn btn-danger" onclick="clearAllData()">${ICONS.trash} Apagar todos os dados</button>
        </div>
      </div>
      <div class="card mt2">
        <div class="card-title">${ICONS.repeat} Regras aprendidas</div>
        ${DATA.learnedRules.length===0?'<p class="tiny muted">Nenhuma regra ainda. Corrija categorias no painel para o sistema aprender.</p>':
        `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Padrão</th><th>Categoria</th><th></th></tr></thead>
        <tbody>${DATA.learnedRules.map(r=>`<tr><td class="tiny muted">${escapeHtml(r.pattern)}</td><td>${escapeHtml(r.category)}</td>
        <td><button class="modal-close" onclick="deleteRule(${JSON.stringify(r.pattern)})">${ICONS.trash}</button></td></tr>`).join('')}</tbody></table></div>`}
      </div>
    </div>
  </div>`;
};
function toggleEye(btn){ const inp=document.getElementById('apiKey'); inp.type=inp.type==='password'?'text':'password'; }
function saveSettings(){
  DATA.settings.apiKey=(document.getElementById('apiKey')?.value||'').trim();
  DATA.settings.aiDisabled=document.getElementById('aiDisabled')?.checked||false;
  DATA.settings.monthStart=parseInt(document.getElementById('monthStart')?.value)||1;
  saveData(); showToast('Configurações salvas','success');
}
function backupData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`sfi_backup_${todayISO()}.json`; a.click();
  showToast('Backup exportado','success');
}
function restoreData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!parsed.transactions) throw new Error('Arquivo inválido');
      DATA=Object.assign(defaultData(),parsed,{settings:Object.assign(defaultData().settings,parsed.settings||{})});
      saveData(); showToast(`${DATA.transactions.length} transações restauradas`,'success'); navigate('inicio');
    }catch(e){ showToast('Arquivo inválido ou corrompido','error'); }
  };
  r.readAsText(f);
}
function clearAllData(){
  confirmModal('Apagar todos os dados','Esta ação é IRREVERSÍVEL. Todos os dados serão perdidos.',()=>{
    DATA=defaultData(); saveData(); showToast('Dados apagados','success'); navigate('inicio');
  }, true);
}
function deleteRule(pattern){
  DATA.learnedRules=DATA.learnedRules.filter(r=>r.pattern!==pattern);
  saveData(); showToast('Regra removida','success'); navigate('ajustes');
}

/* ============================================================
   QUICK DECISION MODE  (Ctrl + Space)
   ============================================================ */
function openQuickDecision(){
  if(DATA.transactions.length===0){ showToast('Importe extratos primeiro','info'); return; }
  const m=currentMonth(), txs=inMonth(m);
  const expense=sumExpense(txs), income=sumIncome(txs), balance=income-expense;
  const proj=projectMonthEnd();
  const budgetAlerts=DATA.budgets.map(b=>{
    const spent=byCategory(txs).find(c=>c.category===b.category)?.total||0;
    const pct=b.limit>0?spent/b.limit*100:0;
    return {category:b.category, spent, limit:b.limit, pct};
  }).filter(b=>b.pct>=70).sort((a,b)=>b.pct-a.pct);

  openModal({
    title:'Decisão Rápida', wide:false,
    body:`
    <div style="background:var(--bg);border-radius:10px;padding:16px;margin-bottom:16px">
      <div class="flex between"><span class="muted tiny">Saldo do mês</span><b style="font-size:18px;color:${balance>=0?'var(--income)':'var(--expense)'}">${fmtMoney(balance)}</b></div>
      <div class="flex between mt"><span class="muted tiny">Gastos até agora</span><span class="amt-neg">${fmtMoney(expense)}</span></div>
      <div class="flex between mt"><span class="muted tiny">Projeção do mês</span><span class="${proj.expense>income?'amt-neg':'muted'}">${fmtMoney(proj.expense)}</span></div>
    </div>
    ${budgetAlerts.length?`<div style="margin-bottom:14px">
      <div class="tiny muted mb" style="margin-bottom:8px">Orçamentos próximos do limite</div>
      ${budgetAlerts.map(b=>`<div style="margin-bottom:8px">
        <div class="flex between tiny"><span>${b.category}</span><span class="${b.pct>=100?'amt-neg':'muted'}">${b.pct.toFixed(0)}%</span></div>
        <div class="progress"><div class="progress-bar ${b.pct>=100?'over':b.pct>=80?'warn':'ok'}" style="width:${Math.min(b.pct,100)}%"></div></div>
      </div>`).join('')}</div>`:''}
    <div>
      <label class="tiny muted" style="display:block;margin-bottom:8px">Simular um gasto</label>
      <div class="row">
        <input class="input" id="qdAmount" type="number" placeholder="Valor (R$)" step="10">
        <select class="select" id="qdCat">${ALL_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <div id="qdImpact" class="tiny muted" style="margin-top:10px;min-height:18px"></div>
    </div>`,
    buttons:[{label:'Fechar'},{label:'Ir ao Painel',class:'btn-primary',onClick:()=>navigate('painel')}],
    onMount:(ov)=>{
      const amtI=ov.querySelector('#qdAmount'), catI=ov.querySelector('#qdCat'), imp=ov.querySelector('#qdImpact');
      const calc=()=>{
        const v=parseFloat(amtI.value)||0; if(!v){imp.textContent='';return;}
        const cat=catI.value;
        const newBal=balance-v;
        const budget=DATA.budgets.find(b=>b.category===cat);
        let txt=`Saldo após: <b style="color:${newBal>=0?'var(--income)':'var(--expense)'}">${fmtMoney(newBal)}</b>`;
        if(budget){
          const spent=byCategory(txs).find(c=>c.category===cat)?.total||0;
          const newSpent=spent+v;
          const pct=newSpent/budget.limit*100;
          txt+=` · ${cat}: ${fmtMoney(newSpent)}/${fmtMoney(budget.limit)} (${pct.toFixed(0)}%)`;
          if(pct>100) txt+=' <span style="color:var(--expense)">⚠ acima do limite!</span>';
        }
        imp.innerHTML=txt;
      };
      amtI.oninput=calc; catI.onchange=calc;
    }
  });
}
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.code==='Space'){ e.preventDefault(); openQuickDecision(); } });

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
renderNav();
navigate('inicio');

</script>
